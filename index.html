  if (!tot) verdict = bo?"འོས་ཤོག་མེད།":"No votes were cast.";
  else if (round==="prelim" && topPct>60){ verdict = bo?`${top} ལ་བརྒྱ་ཆ་ ${num(topPct.toFixed(0))} ཐོབ་པས་ཐད་ཀར་རྒྱལ། 🎉`:`🎉 ${top} wins outright with ${topPct.toFixed(0)}%! No final round needed.`; }
  else if (round==="prelim"){ verdict = bo?`སུས་ཀྱང་བརྒྱ་ཆ་ ༦༠ མ་ཐོབ། མཐོ་ཤོས་གཉིས་མཐའ་འདེམས་སུ་འགྲོ།`:`Nobody passed 60%, so the top two go to a final round.`; action = `<button type="button" class="btn" data-mfinal style="width:100%;justify-content:center;margin-top:10px">${bo?"མཐའ་འདེམས་འགོ་འཛུགས།":"Start final round"}: ${esc(sorted[0])} vs ${esc(sorted[1])}</button>`; }
  else if ((counts[sorted[0]]||0)===(counts[sorted[1]]||0)){ verdict = bo?"འོས་གྲངས་མཉམ། ཡང་བསྐྱར་འོས་བསྡུ་བྱེད་དགོས། (དོན་ཚན་ ༢༡ཀ)":"It's a tie! Under Article 21A, a fresh round is held between the two."; action = `<button type="button" class="btn" data-mfinal style="width:100%;justify-content:center;margin-top:10px">${bo?"ཡང་བསྐྱར་འོས་བསྡུ།":"Hold a fresh round"}</button>`; }
  else verdict = bo?`${top} རྒྱལ་ཁ་ཐོབ། 🎉`:`🎉 ${top} wins the final round!`;
  return `<div class="card"><p class="label">${rTitle} · ${bo?"མཇུག་འབྲས།":"Results"}</p>${bars(counts,cands)}<p style="margin:10px 0 0;font-weight:600">${esc(verdict)}</p><p class="mode">${bo?`འོས་ཤོག་བསྡོམས་ ${num(tot)}`:`${tot} vote${tot===1?"":"s"} cast`}</p>${action}
    <button type="button" class="btn alt" data-mreset style="width:100%;justify-content:center;margin-top:10px">${bo?"འོས་བསྡུ་གསར་པ།":"New election"}</button>
    <p class="mode" style="margin-top:10px">${bo?"འདི་ནི་སློབ་སྦྱོང་ཆེད་ཀྱི་འཆར་སྟོན་ཡིན། དངོས་ཡོད་འོས་བསྡུར་མིང་ཐོ་དང་སྒྲིག་གཞི་གཞན་ཡང་ཡོད།":"Simplified for learning. Real CTA elections also have candidate shortlists, registration and other rules."}</p></div>`;
}
document.addEventListener("input", e=>{
  if (e.target.dataset.mc!==undefined){ mock.cands[+e.target.dataset.mc]=e.target.value; const v=mock.cands.map(c=>c.trim()).filter(Boolean); const b=$("[data-mstart]"); if(b){ const ok=v.length>=2&&new Set(v).size===v.length; b.disabled=!ok; b.style.opacity=ok?"1":".5"; } }
  if (e.target.id==="mTitle") mock.title=e.target.value;
});
document.addEventListener("click", e=>{
  const t = e.target;
  const gm = t.closest("[data-game]"); if (gm){ openGame(gm.dataset.game); return; }
  if (t.closest("[data-gback]")){ openGame(null); return; }
  if (t.closest("[data-greplay]")){ startGame(curGame); return; }
  const an = t.closest("[data-ans]"); if (an && curGame){ const k=+an.dataset.ans; if (G.picked!==null) return; G.picked=k;
    if (curGame==="quiz" && k===QUIZ[G.qs[G.i]].a) G.score++;
    if (curGame==="story" && STORY[G.i].o[k].ok) G.score++;
    if (curGame==="words" && G.opts[G.i][k]===G.qs[G.i]) G.score++;
    renderGame(); return; }
  if (t.closest("[data-gnext]")){ G.i++; G.picked=null; renderGame(); window.scrollTo(0,0); return; }
  const mm = t.closest("[data-mmode]"); if (mm){ G.mode=mm.dataset.mmode; setupMatch(); renderGame(); return; }
  const ml = t.closest("[data-ml]"); if (ml){ G.sel=+ml.dataset.ml; G.bad=null; renderGame(); return; }
  const mr = t.closest("[data-mr]"); if (mr){ if (G.sel===null) return; const r=+mr.dataset.mr; if (r===G.sel){ G.done.add(r); G.sel=null; G.bad=null; } else { G.miss++; G.bad=r; } renderGame(); return; }
  if (t.closest("[data-mcadd]")){ mock.cands.push(""); renderGame(); return; }
  const mcd = t.closest("[data-mcdel]"); if (mcd){ mock.cands.splice(+mcd.dataset.mcdel,1); renderGame(); return; }
  if (t.closest("[data-mstart]")){ mock.cands=mock.cands.map(c=>c.trim()).filter(Boolean); mock.stage="prelim-vote"; mock.prelim={}; mock.voter=1; mock.voted=false; renderGame(); return; }
  const mv = t.closest("[data-mvote]"); if (mv){ const r=mock.stage.startsWith("prelim")?"prelim":"final"; mock[r][mv.dataset.mvote]=(mock[r][mv.dataset.mvote]||0)+1; mock.voted=true; renderGame(); return; }
  if (t.closest("[data-mnext]")){ mock.voter++; mock.voted=false; renderGame(); return; }
  if (t.closest("[data-mcount]")){ mock.stage = mock.stage.startsWith("prelim")?"prelim-results":"final-results"; renderGame(); return; }
  if (t.closest("[data-mfinal]")){ const src = mock.stage.startsWith("prelim")?mock.prelim:mock.final; const pool = mock.stage.startsWith("prelim")?mock.cands:mock.finalists;
    mock.finalists = pool.slice().sort((a,b)=>(src[b]||0)-(src[a]||0)).slice(0,2); mock.final={}; mock.stage="final-vote"; mock.voter=1; mock.voted=false; renderGame(); return; }
  if (t.closest("[data-mreset]")){ mock=null; startGame("mock"); return; }
});

/* community sub-tabs, channels, rules */
function setCSub(s){ $$("#comTabs [data-csub]").forEach(b=>b.setAttribute("aria-selected", b.dataset.csub===s)); ["games","discuss","polls"].forEach(x=>{ $("#csub-"+x).hidden = x!==s; }); }
$("#comTabs").addEventListener("click", e=>{ const b=e.target.closest("[data-csub]"); if(b) setCSub(b.dataset.csub); });
function renderCommunity(){
  $("#rulesList").innerHTML = RULES.map(r=>`<li>${esc(L(r))}</li>`).join("");
  $("#chanList").innerHTML = CHANNELS.map(c=> c.u ? `<a class="card dir" href="${c.u}" target="_blank" rel="noopener"><div class="ic ${c.c}" style="font-size:1.4rem">${c.i}</div><div><h3>${esc(L(c.n))}</h3><p>${esc(L(c.d))}</p></div><span class="go" aria-hidden="true">›</span></a>`
     : `<div class="card dir" style="opacity:.7"><div class="ic ${c.c}" style="font-size:1.4rem">${c.i}</div><div><h3>${esc(L(c.n))}</h3><p>${LANG==="bo"?"མྱུར་དུ་ཡོང་།":"Coming soon"}</p></div></div>`).join("");
  if (curGame) renderGame(); else renderGameMenu();
  if (FIREBASE_CONFIG && !window.renderChat) $("#liveChat").innerHTML = `<div class="card status">${LANG==="bo"?"ཁ་བརྡ་ཕབ་ལེན་བྱེད་བཞིན།…":"Loading live chat…"}</div>`;
  renderBoard(); renderPolls(); if (window.renderChat) window.renderChat();
}
initShared();

renderAll();
show(location.hash.slice(1));
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const ROOMS = [
  {id:"general",   t:{en:"General",      bo:"སྤྱིར་བཏང་།"}},
  {id:"charter",   t:{en:"Charter",      bo:"བཅའ་ཁྲིམས།"}},
  {id:"elections", t:{en:"Elections",    bo:"འོས་བསྡུ།"}},
  {id:"greenbook", t:{en:"Green Book",   bo:"རང་བཙན་ལག་དེབ།"}},
  {id:"ideas",     t:{en:"Ideas for CTA",bo:"བསམ་འཆར།"}},
];
const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const fs = getFirestore(app);
let me = null, isAdmin = false, room = "general", msgs = [], unsub = null, chatState = "loading", sending = false, banned = false, showId = false;

/* hide the claude.ai-only board on the website */
boardState = "hidden";

function subscribe(){
  if (unsub) unsub();
  chatState = "loading"; msgs = []; render();
  const q = query(collection(fs, "rooms", room, "messages"), orderBy("ts", "desc"), limit(100));
  unsub = onSnapshot(q, snap => { msgs = snap.docs.map(d => ({id:d.id, ...d.data()})).reverse(); chatState = "ok"; render(true); },
                        () => { chatState = "err"; render(); });
}
onAuthStateChanged(auth, async u => {
  me = u; isAdmin = false; banned = false; ME = u ? u.uid : null;
  if (u){
    try{ isAdmin = (await getDoc(doc(fs, "admins", u.uid))).exists(); }catch(e){}
    try{ banned = (await getDoc(doc(fs, "banned", u.uid))).exists(); }catch(e){}
  }
  render(); renderPolls();
});
getRedirectResult(auth).catch(()=>{});

async function signIn(){
  const p = new GoogleAuthProvider();
  try{ await signInWithPopup(auth, p); }
  catch(e){ if (e && (e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment")) await signInWithRedirect(auth, p); else flash(LANG==="bo"?"ནང་འཛུལ་མ་ཐུབ།":"Sign-in didn't work. Please try again."); }
}

/* polls on Firebase */
votesState = "loading";
onSnapshot(collection(fs, "pollVotes"), snap => { votesDocs = snap.docs.map(d => ({uid:d.id, ...d.data()})); votesState = "ok"; renderPolls(); }, () => { votesState = "err"; renderPolls(); });
window.fbVote = async (pid, oid) => {
  if (!me){ signIn(); return; }
  const mine = {...(votesDocs.find(v => v.uid === me.uid) || {})}; delete mine.uid;
  if (mine[pid] === oid) return; mine[pid] = oid;
  try{ await setDoc(doc(fs, "pollVotes", me.uid), mine); }catch(e){ const el=$("#pollAlert"); if(el){ el.hidden=false; el.textContent = LANG==="bo"?"འོས་འཕེན་མ་ཐུབ།":"Couldn't save your vote."; } }
};

let flashT;
function flash(msg){ const el = $("#chatFlash"); if(!el) return; el.textContent = msg; el.hidden = false; clearTimeout(flashT); flashT = setTimeout(()=>{ el.hidden = true; }, 5000); }
const tm = ts => { if (!ts || !ts.toDate) return LANG==="bo"?"གཏོང་བཞིན།…":"sending…"; const d = ts.toDate(); const s = (Date.now()-d)/1000;
  if (s < 86400) return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); return d.toLocaleDateString("en-GB", {day:"numeric", month:"short"}); };

function render(scroll){
  const w = $("#liveChat"); if (!w) return; const bo = LANG === "bo";
  const keep = $("#chatInput") ? $("#chatInput").value : "";
  w.innerHTML = `<div class="card chat">
    <div class="chat-h"><h3>💬 ${bo?"ཐད་གཏོང་ཁ་བརྡ།":"Live chat"}</h3><span class="live-dot">${bo?"ཐད་གཏོང་།":"Live"}</span></div>
    <div class="topics" role="group" aria-label="Chat rooms">${ROOMS.map(r=>`<button type="button" data-room="${r.id}" aria-pressed="${room===r.id}"># ${esc(L(r.t))}</button>`).join("")}</div>
    <div class="msgs" id="msgs" aria-live="polite">${
      chatState==="loading" ? `<p class="status">${bo?"ཕབ་ལེན་བྱེད་བཞིན།…":"Loading messages…"}</p>` :
      chatState==="err" ? `<p class="status">${bo?"ཁ་བརྡ་འབྲེལ་མ་ཐུབ།":"Chat can't be reached right now."}</p>` :
      msgs.length ? msgs.map(m=>`<div class="msg ${me&&m.uid===me.uid?"own":""}"><div class="mh"><b></b><span>${tm(m.ts)}</span>
        ${me&&(m.uid===me.uid||isAdmin)?`<button type="button" class="lnk del" data-cdel="${m.id}">${bo?"སུབ།":"Delete"}</button>`:""}
        ${isAdmin&&me&&m.uid!==me.uid?`<button type="button" class="lnk del" data-cban="${m.uid}">${bo?"བཀག":"Ban"}</button>`:""}</div><p></p></div>`).join("")
      : `<p class="status">${bo?"ད་དུང་ཁ་བརྡ་མེད། དང་པོ་ཁྱེད་ཀྱིས་བཤད།":"No messages yet. Say tashi delek! 👋"}</p>`}</div>
    <p class="note" id="chatFlash" hidden role="status"></p>
    ${!me ? `<button type="button" class="btn" data-csignin style="width:100%;justify-content:center;margin-top:10px">${bo?"Google ཐོག་ནང་འཛུལ་བྱས་ཏེ་ཁ་བརྡ་གཏོང་།":"Sign in with Google to chat"}</button>
             <p class="mode">${bo?"ནང་འཛུལ་མ་བྱས་ཀྱང་ཀློག་ཆོག":"Anyone can read. Sign in to post."}</p>`
      : banned ? `<p class="note">${bo?"ཁྱེད་ཀྱི་ཁ་བརྡ་གཏོང་བ་བཀག་ཡོད།":"You can't post in this chat."}</p>`
      : `<form class="rform" id="chatForm"><label class="sr" for="chatInput">${bo?"ཁ་བརྡ།":"Message"}</label><input id="chatInput" class="field" maxlength="500" autocomplete="off" placeholder="${bo?"ཁ་བརྡ་འབྲི།…":"Write a message…"}"><button class="btn" type="submit" ${sending?"disabled":""}>${bo?"གཏོང་།":"Send"}</button></form>
         <p class="mode">${bo?`ནང་འཛུལ། ${esc(me.displayName||"")}`:`Signed in as ${esc(me.displayName||"you")}`}${isAdmin?(bo?" · འཛིན་སྐྱོང་བ།":" · moderator"):""} · <button type="button" class="lnk" data-csignout>${bo?"ཕྱིར་ཐོན།":"Sign out"}</button> · <button type="button" class="lnk" data-cmyid>${bo?"ངའི་ ID":"My ID"}</button></p>
         ${showId?`<p class="mode" style="user-select:all;word-break:break-all">${esc(me.uid)}</p>`:""}`}
  </div>`;
  const nodes = w.querySelectorAll(".msg"); msgs.forEach((m,i)=>{ const n=nodes[i]; if(!n) return; n.querySelector("b").textContent = m.name || "Someone"; n.querySelector("p").textContent = m.text || ""; });
  const inp = $("#chatInput"); if (inp && keep) inp.value = keep;
  const box = $("#msgs"); if (box && scroll !== false) box.scrollTop = box.scrollHeight;
}
window.renderChat = () => render(false);

document.addEventListener("click", async e => {
  const t = e.target;
  const r = t.closest("[data-room]"); if (r){ room = r.dataset.room; subscribe(); return; }
  if (t.closest("[data-csignin]")) { signIn(); return; }
  if (t.closest("[data-csignout]")) { signOut(auth); return; }
  if (t.closest("[data-cmyid]")) { showId = !showId; render(false); return; }
  const d = t.closest("[data-cdel]"); if (d){
    if (!d.dataset.confirm){ d.dataset.confirm="1"; d.textContent = LANG==="bo"?"གཏན་འཁེལ།":"Tap again"; setTimeout(()=>{ if(d.isConnected){ delete d.dataset.confirm; d.textContent = LANG==="bo"?"སུབ།":"Delete"; } }, 3000); return; }
    try{ await deleteDoc(doc(fs, "rooms", room, "messages", d.dataset.cdel)); }catch(err){ flash(LANG==="bo"?"སུབ་མ་ཐུབ།":"Couldn't delete."); } return; }
  const b = t.closest("[data-cban]"); if (b){
    if (!b.dataset.confirm){ b.dataset.confirm="1"; b.textContent = LANG==="bo"?"གཏན་འཁེལ།":"Tap again to ban"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.confirm; b.textContent = LANG==="bo"?"བཀག":"Ban"; } }, 3000); return; }
    try{ await setDoc(doc(fs, "banned", b.dataset.cban), {by: me.uid, at: serverTimestamp()}); flash(LANG==="bo"?"བཀག་ཟིན།":"User banned. Delete their messages if needed."); }catch(err){ flash("Couldn't ban."); } return; }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "chatForm") return; e.preventDefault();
  const inp = $("#chatInput"); const text = inp.value.trim(); if (!text || !me || sending) return;
  sending = true;
  try{
    await addDoc(collection(fs, "rooms", room, "messages"), {text: text.slice(0,500), uid: me.uid, name: (me.displayName || "Someone").slice(0,60), ts: serverTimestamp()});
    inp.value = "";
  }catch(err){ flash(LANG==="bo"?"གཏོང་མ་ཐུབ།":"Message not sent. Please try again."); }
  sending = false; render();
});
subscribe();

</script>
