<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTA Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Tibetan:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f0; --surface:#ffffff; --ink:#1d1b18; --muted:#5f5a52; --line:#e5e0d7;
  --brand:#8a1c1c; --brand-ink:#ffffff; --brand-soft:#f6e9e6; --gold:#9a6416; --gold-soft:#fbf1dd;
  --blue:#1f4e8a; --blue-soft:#e7eef8; --green:#2f6b3a; --green-soft:#e6f1e7;
  --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --tabh:68px; --fs:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141311; --surface:#1e1c19; --ink:#f2efe9; --muted:#b0a99d; --line:#33302b;
  --brand:#e07c70; --brand-ink:#1a0f0d; --brand-soft:#3a201d; --gold:#e0a84a; --gold-soft:#36291a;
  --blue:#8fb4e8; --blue-soft:#1c2738; --green:#8cc799; --green-soft:#1c2e20; --shadow:none}
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
html[lang="bo"] body{font-family:"Noto Serif Tibetan",Inter,serif;line-height:1.85}
.bo{font-family:"Noto Serif Tibetan",serif}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.sr{position:absolute;left:-9999px}
.app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.95rem;flex:none}
.brandrow h1{font-size:1.15rem;margin:0;letter-spacing:-.01em;line-height:1.2}
.brandrow p{margin:0;font-size:.78rem;color:var(--muted);line-height:1.3}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.tbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg2 button{border:0;background:none;padding:6px 11px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:36px}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
main{padding:16px}
section[hidden],.sub[hidden]{display:none}
h2{font-size:1.4rem;margin:4px 0 4px;letter-spacing:-.015em;line-height:1.3}
h3{line-height:1.35}
.lede{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
.note{font-size:.82rem;color:var(--muted);background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin-top:16px}
.note strong{color:var(--ink)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:0 0 8px}
html[lang="bo"] .label{text-transform:none;letter-spacing:0;font-size:.85rem}
.segtabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}
.segtabs button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer;min-height:42px}
.segtabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
.speak{border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.speak svg{width:17px;height:17px}
.speak[data-on="1"]{background:var(--blue);color:var(--surface)}
.needs-tts{display:none}
body.tts-ok .needs-tts{display:inline-grid}
body.tts-ok .tbtn.needs-tts{display:inline-flex}

/* Ask */
.search{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--brand)}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);min-width:0;outline:none}
.search button{border:0;background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:.95rem;border-radius:999px;padding:10px 16px;cursor:pointer;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font-weight:500;font-size:.88rem;cursor:pointer;min-height:40px;text-align:left}
.chip:hover{border-color:var(--brand);background:var(--brand-soft)}
.answer .qrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.answer .q{font-weight:600;margin:0 0 8px}
.answer .body{white-space:pre-wrap}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ref{font-size:.78rem;font-weight:600;background:var(--blue-soft);color:var(--blue);padding:4px 9px;border-radius:8px;border:0;cursor:pointer}
.srcs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.srcs a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;padding:8px 0;font-size:.9rem;font-weight:500;color:var(--blue)}
.srcs a span:last-child{color:var(--muted);white-space:nowrap}
.mode{font-size:.75rem;color:var(--muted);margin-top:10px}
.typing{color:var(--muted)}

/* Charter browser */
.filter{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;margin-bottom:12px}
.filter:focus{border-color:var(--brand);outline:none}
.chap{margin:18px 0 8px;font-weight:700;font-size:.95rem;color:var(--brand)}
.art{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.art summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.art summary::-webkit-details-marker{display:none}
.art .num{font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:8px;min-width:44px;text-align:center;font-size:.85rem;padding:3px 6px;flex:none}
.art .tt{font-weight:600;font-size:.95rem;line-height:1.35}
.art .ss{font-size:.86rem;color:var(--muted);margin-top:2px}
.art.rep .tt,.art.rep .ss{opacity:.6}
.art .full{padding:0 14px 14px;font-size:.88rem;white-space:pre-wrap;border-top:1px solid var(--line);margin-top:0;padding-top:12px;color:var(--ink)}
.art .full .lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;white-space:normal}
mark{background:var(--gold-soft);color:inherit;border-radius:3px}
.count{font-size:.8rem;color:var(--muted);margin:-4px 0 4px}

/* Glossary */
.gl{display:flex;gap:12px;align-items:flex-start}
.gl .w{flex:1}
.gl h3{margin:0;font-size:1.02rem}
.gl .tib{font-family:"Noto Serif Tibetan",serif;font-size:1.15rem;color:var(--brand)}
.gl .ph{font-size:.8rem;color:var(--muted);font-style:italic}
.gl p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}

/* Directory */
.dir{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;min-height:76px}
.dir:hover{border-color:var(--brand)}
.ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.dir h3{font-size:1rem;margin:0 0 2px}
.dir p{margin:0;font-size:.85rem;color:var(--muted)}
.dir .url{font-size:.78rem;color:var(--blue);font-weight:500;margin-top:3px}
.dir .go{margin-left:auto;color:var(--muted);flex:none}
.t-red{background:var(--brand-soft);color:var(--brand)} .t-gold{background:var(--gold-soft);color:var(--gold)}
.t-blue{background:var(--blue-soft);color:var(--blue)} .t-green{background:var(--green-soft);color:var(--green)}
.h-sec{font-size:1.05rem;margin:26px 0 4px}

/* Who's who */
.asof{display:inline-block;font-size:.74rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:-6px 0 12px}
.lead{display:flex;gap:14px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.05rem;flex:none}
.lead h3{margin:0;font-size:1.08rem}
.lead .role{font-size:.85rem;color:var(--muted)}
.lead .meta2{font-size:.8rem;color:var(--muted);margin-top:4px}
.rows,details.card ul.rows{list-style:none;margin:8px 0 0;padding:0;color:var(--ink)}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem;align-items:baseline}
.rows li:first-child{border-top:0}
.rows .nm{font-weight:600}
.rows .pf{color:var(--muted);text-align:right;font-size:.85rem}
.rows .pf small{display:block;font-size:.76rem}
details.card .cons{margin:12px 0 0}
.cons h4{margin:12px 0 4px;font-size:.82rem;color:var(--brand);text-transform:uppercase;letter-spacing:.05em}
html[lang="bo"] .cons h4{text-transform:none;letter-spacing:0;font-size:.92rem}
.cons h4:first-child{margin-top:0}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:.84rem}
.names span.hl{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.bar{margin:10px 0}
.bar .lbl2{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:4px}
.bar .lbl2 b{font-weight:600}
.bar .track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.1rem}
.stats span{font-size:.72rem;color:var(--muted)}

/* Org chart */
.org{display:flex;flex-direction:column;align-items:stretch;gap:0}
.node{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink);width:100%;line-height:1.35}
.node small{display:block;font-weight:500;color:var(--muted);font-size:.75rem;margin-top:2px}
.node:hover,.node[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.node.people{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.node.people small{color:var(--brand-ink);opacity:.85}
.node.people[aria-pressed="true"]{background:var(--brand);outline:3px solid var(--gold)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conn{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:.75rem;padding:6px 0;text-align:center}
.conn svg{width:14px;height:20px;flex:none}
.pill-lbl{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin:2px 0 6px}
html[lang="bo"] .pill-lbl{text-transform:none;letter-spacing:0}
.detail{margin-top:14px;background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:.9rem}
.detail h4{margin:0 0 4px;font-size:.98rem}
.detail p{margin:0}
.detail .art-l{font-size:.78rem;font-weight:600;color:var(--blue);margin-top:6px}

/* TV */
.live{display:flex;align-items:center;gap:10px;text-decoration:none;background:var(--brand);color:var(--brand-ink);border-radius:var(--radius);padding:16px}
.live .dot{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite;flex:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
.live h3{margin:0;font-size:1rem}.live p{margin:0;font-size:.85rem;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vid{text-decoration:none;color:inherit;overflow:hidden;padding:0}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;position:relative}
.thumb svg{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.thumb .tag{position:absolute;left:8px;bottom:8px;font-size:.7rem;font-weight:600;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:6px}
.th1{background:linear-gradient(135deg,#8a1c1c,#c2492f)} .th2{background:linear-gradient(135deg,#1f4e8a,#3f7fc4)}
.th3{background:linear-gradient(135deg,#9a6416,#e0a84a)} .th4{background:linear-gradient(135deg,#2f6b3a,#5aa36a)}
.vid .meta{padding:10px 12px 12px}
.vid h3{font-size:.9rem;margin:0 0 2px}
.vid p{font-size:.78rem;color:var(--muted);margin:0}

/* Voter */
.vg{display:flex;gap:14px;align-items:flex-start}
.big{font-size:1.7rem;font-weight:700;line-height:1;min-width:62px;text-align:center;padding:12px 4px;border-radius:12px;flex:none}
.big small{display:block;font-size:.66rem;font-weight:600;margin-top:5px;text-transform:uppercase;letter-spacing:.03em}
.vg .w{flex:1}
.vg h3{margin:0 0 4px;font-size:1rem}
.vg p{margin:0;font-size:.9rem;color:var(--muted)}
.artl{font-size:.78rem;color:var(--blue);font-weight:600;margin-top:6px;display:inline-block}
details.card summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px;gap:8px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:1.25rem;color:var(--muted)}
details[open].card summary::after{content:"–"}
details.card ul,details.card ol{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:.9rem}
details.card li{margin:5px 0}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding:0 0 16px 44px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.88rem}
.steps li:not(:last-child)::after{content:"";position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps h4{margin:3px 0 2px;font-size:.95rem}.steps p{margin:0;font-size:.88rem;color:var(--muted)}

/* Checker */
.chk .qn{font-weight:600;margin:14px 0 8px;font-size:.95rem}
.chk .qn:first-of-type{margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:500;font-size:.88rem;cursor:pointer;min-height:42px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.age{display:flex;align-items:center;gap:10px}
.age input{width:96px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.result{margin-top:16px;border-radius:12px;padding:14px;display:none}
.result.show{display:block}
.result.ok{background:var(--green-soft)} .result.warn{background:var(--gold-soft)} .result.no{background:var(--brand-soft)}
.result h4{margin:0 0 6px;font-size:1.02rem}
.result ul{margin:6px 0 0;padding-left:18px;font-size:.9rem}
.result li{margin:3px 0}

/* Countdown */
.cd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.cd div{background:var(--brand-soft);border-radius:12px;text-align:center;padding:10px 4px}
.cd b{display:block;font-size:1.6rem;color:var(--brand);line-height:1.1}
.cd span{font-size:.75rem;color:var(--muted);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;text-decoration:none;cursor:pointer;min-height:42px}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.est{display:inline-block;font-size:.7rem;font-weight:700;background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;line-height:1.2}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
footer{font-size:.75rem;color:var(--muted);text-align:center;padding:8px 18px 0}
.wa{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #25D366;color:#128C7E;background:transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;text-decoration:none;margin-top:10px;min-height:36px}
@media (prefers-color-scheme:dark){.wa{color:#5fe08f}}
.wa svg{width:15px;height:15px}
.chat-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.chat-h h3{margin:0;font-size:1.05rem}
.live-dot{font-size:.75rem;font-weight:700;color:var(--green);display:inline-flex;align-items:center;gap:5px}
.live-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.msgs{max-height:52vh;min-height:180px;overflow-y:auto;background:var(--bg);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:7px 10px;max-width:86%;align-self:flex-start}
.msg.own{align-self:flex-end;background:var(--brand-soft);border-color:transparent;border-radius:12px 12px 4px 12px}
.msg .mh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.msg .mh b{color:var(--ink);font-size:.8rem}
.msg .mh .lnk{min-height:0;padding:0;font-size:.74rem}
.msg p{margin:2px 0 0;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
/* Community */
.gcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.gcard:hover{border-color:var(--brand)}
.gcard .emo{font-size:1.6rem;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none}
.gcard h3{margin:0;font-size:1rem}.gcard p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.back{border:0;background:none;color:var(--brand);font-weight:600;font-size:.9rem;cursor:pointer;padding:6px 0;margin-bottom:6px;min-height:36px}
.prog{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.prog div{height:100%;background:var(--brand);transition:width .3s}
.qtext{font-size:1.1rem;font-weight:600;margin:4px 0 14px;line-height:1.45}
.ans{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;margin-top:8px;font:inherit;font-size:.95rem;cursor:pointer;min-height:48px}
.ans.right{border-color:var(--green);background:var(--green-soft);font-weight:600}
.ans.wrong{border-color:var(--brand);background:var(--brand-soft)}
.ans:disabled{cursor:default}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:.92rem;background:var(--blue-soft)}
.fb b{display:block;margin-bottom:2px}
.score{text-align:center;padding:10px 0}
.score .big2{font-size:2.6rem;font-weight:700;color:var(--brand);line-height:1.1}
.pillrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.pill{background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:.8rem;border-radius:999px;padding:4px 10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .stack{display:flex;flex-direction:column;gap:8px}
.match .stack>*+*{margin-top:0}
.mt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:.86rem;cursor:pointer;min-height:52px;text-align:center;line-height:1.3}
.mt.sel{border-color:var(--blue);background:var(--blue-soft);font-weight:600}
.mt.done{border-color:var(--green);background:var(--green-soft);color:var(--green);cursor:default;opacity:.8}
.mt.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mt.bad{animation:none}}
.modes{display:flex;gap:8px;margin-bottom:12px}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:.95rem;margin-top:6px}
.field:focus{border-color:var(--brand);outline:none}
textarea.field{min-height:90px;resize:vertical}
.flabel{font-size:.85rem;font-weight:600;margin-top:12px;display:block}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.cands .row{display:flex;gap:6px}
.cands .row input{flex:1}
.x{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;width:44px;cursor:pointer;font-size:1.1rem}
.bigvote{display:block;width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:16px;margin-top:10px;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer;min-height:56px}
.bigvote:hover{border-color:var(--brand);background:var(--brand-soft)}
.privacy{text-align:center;padding:24px 8px}
.privacy .ic2{font-size:2.4rem}
/* board */
.topics{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.topics button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;cursor:pointer;min-height:38px}
.topics button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.post .ph2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.post h3{margin:0;font-size:1rem}
.post .by{font-size:.78rem;color:var(--muted);margin-top:2px}
.post .tx{margin:8px 0 0;font-size:.93rem;white-space:pre-wrap;overflow-wrap:anywhere}
.post .tg{font-size:.72rem;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:2px 7px;white-space:nowrap}
.post .acts{display:flex;gap:12px;margin-top:10px;align-items:center}
.lnk{border:0;background:none;color:var(--blue);font-weight:600;font-size:.84rem;cursor:pointer;padding:4px 0;min-height:32px}
.lnk.del{color:var(--brand)}
.replies{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.reply{padding:8px 0 8px 12px;border-left:3px solid var(--line);margin:6px 0}
.reply .by{margin:0}
.reply .tx{margin:2px 0 0}
.rform{display:flex;gap:6px;margin-top:8px}
.rform input{flex:1;margin:0}
.status{font-size:.85rem;color:var(--muted);text-align:center;padding:14px}
/* polls */
.poll h3{margin:0 0 4px;font-size:1rem}
.popt{position:relative;display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px 12px;margin-top:8px;font:inherit;font-size:.92rem;cursor:pointer;overflow:hidden;min-height:46px}
.popt .fillp{position:absolute;inset:0 auto 0 0;background:var(--brand-soft);z-index:0;transition:width .4s}
.popt span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px}
.popt.mine{border-color:var(--brand);font-weight:600}
.poll .tot{font-size:.78rem;color:var(--muted);margin-top:8px}
.rules{margin:8px 0 0;padding-left:20px;font-size:.92rem}
.rules li{margin:6px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brandrow">
      <div class="logo" aria-hidden="true">CH</div>
      <div>
        <h1>CTA Hub <span class="bo" style="font-size:.85rem;color:var(--muted)">· བོད་མིའི་སྒྲིག་འཛུགས།</span></h1>
        <p data-t="sub"></p>
      </div>
    </div>
    <div class="tools">
      <div class="seg2" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="bo" class="bo" aria-pressed="false">བོད་ཡིག</button>
      </div>
      <div class="seg2" role="group" aria-label="Text size">
        <button type="button" data-fs="-1" aria-label="Smaller text">A−</button>
        <button type="button" data-fs="1" aria-label="Larger text">A+</button>
      </div>
      <button type="button" class="tbtn needs-tts" id="readPage" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span data-t="readAloud"></span></button>
    </div>
  </header>

  <main>
    <!-- ASK -->
    <section id="view-ask" role="tabpanel" aria-labelledby="tab-ask">
      <div class="segtabs" role="tablist" aria-label="Ask sections">
        <button role="tab" data-sub="q" aria-selected="true" data-t="subAsk"></button>
        <button role="tab" data-sub="charter" aria-selected="false" data-t="subCharter"></button>
        <button role="tab" data-sub="glossary" aria-selected="false" data-t="subGloss"></button>
      </div>

      <div class="sub" id="sub-q">
        <h2 data-t="askH"></h2>
        <p class="lede" data-t="askLede"></p>
        <form class="search" id="askForm" role="search">
          <label for="q" class="sr" data-t="askLabel"></label>
          <input id="q" type="search" autocomplete="off" enterkeyhint="search">
          <button type="submit" data-t="askBtn"></button>
        </form>
        <div class="chips" id="chips"></div>
        <div id="answers" class="stack" aria-live="polite"></div>
        <p class="note" data-t="askNote" data-html></p>
      </div>

      <div class="sub" id="sub-charter" hidden>
        <h2 data-t="chH"></h2>
        <p class="lede" data-t="chLede"></p>
        <label for="chFilter" class="sr" data-t="chSearch"></label>
        <input id="chFilter" class="filter" type="search" autocomplete="off">
        <p class="count" id="chCount"></p>
        <div id="chList"></div>
        <p class="note" data-t="chNote" data-html></p>
      </div>

      <div class="sub" id="sub-glossary" hidden>
        <h2 data-t="glH"></h2>
        <p class="lede" data-t="glLede"></p>
        <div class="stack" id="glList"></div>
      </div>
    </section>

    <!-- DIRECTORY -->
    <section id="view-directory" role="tabpanel" aria-labelledby="tab-directory" hidden>
      <h2 data-t="whoH"></h2>
      <p class="lede" data-t="whoLede"></p>
      <div class="stack" id="leaders"></div>

      <h3 class="h-sec" data-t="dirH"></h3>
      <p class="lede" data-t="dirLede"></p>
      <div class="stack" id="dirList"></div>

      <h3 class="h-sec" data-t="orgH"></h3>
      <p class="lede" data-t="orgLede"></p>
      <div class="card">
        <div class="org" id="org"></div>
        <div class="detail" id="orgDetail" aria-live="polite"></div>
      </div>

      <h3 class="h-sec" data-t="newsH"></h3>
      <p class="lede" data-t="newsLede"></p>
      <div class="stack" id="newsList"></div>
      <p class="note" data-t="newsNote"></p>
    </section>

    <!-- TIBET TV -->
    <section id="view-tv" role="tabpanel" aria-labelledby="tab-tv" hidden>
      <h2 data-t="tvH"></h2>
      <p class="lede" data-t="tvLede"></p>
      <div class="stack">
        <a class="live" href="https://www.youtube.com/user/ctaonlinetv/streams" target="_blank" rel="noopener">
          <span class="dot" aria-hidden="true"></span>
          <div><h3 data-t="liveH"></h3><p data-t="liveP"></p></div>
        </a>
        <div class="grid" id="tvGrid"></div>
        <p class="note" data-t="tvNote" data-html></p>
      </div>
    </section>

    <!-- VOTER GUIDE -->
    <section id="view-voter" role="tabpanel" aria-labelledby="tab-voter" hidden>
      <h2 data-t="vH"></h2>
      <p class="lede" data-t="vLede"></p>
      <div class="stack">
        <!-- Checker -->
        <div class="card chk" id="checker">
          <p class="label" data-t="ckH"></p>
          <p class="qn" data-t="ckQ1"></p>
          <div class="opts" data-q="cit"></div>
          <p class="qn" data-t="ckQ2"></p>
          <div class="age"><label class="sr" for="ageIn" data-t="ckQ2"></label><input id="ageIn" type="number" min="0" max="120" inputmode="numeric"><span data-t="ckYears" style="color:var(--muted)"></span></div>
          <p class="qn" data-t="ckQ3"></p>
          <div class="opts" data-q="gb"></div>
          <div class="result" id="ckResult" aria-live="polite"></div>
        </div>

        <!-- Countdown -->
        <div class="card" id="countdown"></div>

        <div id="vCards" class="stack"></div>
        <div id="vDetails" class="stack"></div>
        <div class="card" id="vSteps"></div>

        <!-- Green Book -->
        <h3 class="h-sec" data-t="gbH"></h3>
        <p class="lede" data-t="gbLede"></p>
        <div class="stack" id="gbList"></div>

        <a class="card dir" href="https://tibetanelection.net/" target="_blank" rel="noopener">
          <div class="ic t-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg></div>
          <div><h3 data-t="ecH"></h3><p data-t="ecP"></p><div class="url">tibetanelection.net</div></div>
          <span class="go" aria-hidden="true">›</span>
        </a>
        <p class="note" data-t="vNote"></p>
      </div>
    </section>
    <!-- COMMUNITY -->
    <section id="view-community" role="tabpanel" aria-labelledby="tab-community" hidden>
      <div class="segtabs" role="tablist" aria-label="Community sections" id="comTabs">
        <button role="tab" data-csub="games" aria-selected="true" data-t="cGames"></button>
        <button role="tab" data-csub="discuss" aria-selected="false" data-t="cDiscuss"></button>
        <button role="tab" data-csub="polls" aria-selected="false" data-t="cPolls"></button>
      </div>

      <div class="sub" id="csub-games">
        <div id="gameMenu">
          <h2 data-t="gH"></h2>
          <p class="lede" data-t="gLede"></p>
          <div class="stack" id="gameList"></div>
        </div>
        <div id="gameArea" hidden></div>
      </div>

      <div class="sub" id="csub-discuss" hidden>
        <h2 data-t="dH"></h2>
        <p class="lede" data-t="dLede"></p>
        <details class="card" id="rulesCard"><summary data-t="rulesH"></summary><ol class="rules" id="rulesList"></ol></details>
        <div id="liveChat" style="margin-top:12px"></div>
        <div id="boardWrap" style="margin-top:12px"></div>
        <h3 class="h-sec" data-t="chanH"></h3>
        <p class="lede" data-t="chanLede"></p>
        <p class="note" data-t="waTip"></p>
        <div class="stack" id="chanList"></div>
      </div>

      <div class="sub" id="csub-polls" hidden>
        <h2 data-t="pH"></h2>
        <p class="lede" data-t="pLede"></p>
        <div class="stack" id="pollList"></div>
      </div>
    </section>
  </main>
  <footer data-t="foot" data-html></footer>
</div>

<nav class="tabs" aria-label="Main">
  <div class="in" role="tablist">
    <button role="tab" id="tab-ask" data-view="ask" aria-controls="view-ask">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 3M12 16h.01"/></svg><span data-t="tAsk"></span></button>
    <button role="tab" id="tab-directory" data-view="directory" aria-controls="view-directory">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M19 21V10M9 21v-7M15 21v-7M2 10l10-6 10 6"/></svg><span data-t="tDir"></span></button>
    <button role="tab" id="tab-tv" data-view="tv" aria-controls="view-tv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M7 2l5 4 5-4M10 10v6l5-3z"/></svg><span data-t="tTv"></span></button>
    <button role="tab" id="tab-voter" data-view="voter" aria-controls="view-voter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 16l2-10h8l2 10M10 10l2 2 3-4"/></svg><span data-t="tVoter"></span></button>
    <button role="tab" id="tab-community" data-view="community" aria-controls="view-community">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span data-t="tCom"></span></button>
  </div>
</nav>

<script>
const CHARTER = {"chapters":[{"id":"I","name":"General principles"},{"id":"II","name":"Fundamental rights and duties"},{"id":"III","name":"Directive principles"},{"id":"IV","name":"The Executive"},{"id":"V","name":"The Legislature"},{"id":"VI","name":"The Judiciary"},{"id":"VII","name":"Tibetan settlements"},{"id":"VIII","name":"Elections"},{"id":"IX","name":"Public Service Commission"},{"id":"X","name":"Auditor General"},{"id":"XI","name":"Amendment and language"}],"articles":[{"n":"1","t":"Protector and symbol of Tibet and Tibetan people","s":"His Holiness the Dalai Lama is the protector and symbol of Tibet and the Tibetan people.","x":"His Holiness the\n\n1) To work for the progress of the Tibetan people’s wellbeing and their ethics; to protect and promote religion, culture and learning, and to provide guidance, advice and encouragement to the Tibetan people and the Central Tibetan Administration 6 in all areas, including in efforts towards Tibet cause.\n\n2) As and when he sees it necessary, or whenever appealed to by the leadership, His Holiness the Dalai Lama is to provide suggestions on opinions of the Kashag or the Tibetan Parliament-in- Exile on important matters concerned with the Tibetan people, society, religion and politics.\n\n3) To meet and hold discussions with important international leaders and personalities on behalf of the Tibetan people and those appointed by the Kashag as envoys or special envoys shall be given designations as representatives of His Holiness the Dalai Lama.","c":"I","rep":false},{"n":"2","t":"Jurisdiction of this Charter","s":"The Charter applies to all Tibetans under the authority of the CTA.","x":"This charter extends to all Tibetans who are subject to the authority of the Central Tibetan Administration.","c":"I","rep":false},{"n":"3","t":"Nature of the polity","s":"Tibetan governance rests on peace, non-violence, freedom, welfare and democracy.","x":"The governance of future Tibet shall be founded on the principle of peace and non-violence and, on that basis, freedom, social welfare, coexistence of religion and politics, democracy, and self- government. The governance of the Tibetans in exile too shall maintain these principles. And this Charter shall not be amended except in accordance with the provisions of Chapter XI hereof.","c":"I","rep":false},{"n":"4","t":"Fundamental Principles of the Central Tibetan Administration","s":"The CTA follows the UN Universal Declaration of Human Rights.","x":"The Central Tibetan Administration shall adhere to the principles enshrined in the Universal Declaration of Human Rights of the United Nations with respect to human rights; economic, social, and cultural rights; civil and political rights, and also strive to earn respect from the nations and communities across the world. In particular, the Tibetan Administration shall devote itself to accomplishing the tasks of realizing the just cause of the Tibetan people and progress in their ethical standards and material well-being.\n\nTibetan Administration","c":"I","rep":false},{"n":"5","t":"The extent of the Charter’s validation","s":"Any law or order that goes against the Charter is invalid.","x":"1) Any laws, executive orders and regulations that are in violation of any of the provisions of this Charter shall be deemed invalid.\n\n2) As mentioned above,10 in case of any dispute with regard to the question whether any laws, executive orders and regulations are in violation of any of the provisions of this Charter, the Tibetan Supreme Justice Commission shall be the deciding authority.","c":"I","rep":false},{"n":"6","t":"Respect for international law and laws of the concerned country","s":"CTA rules must respect international law and the laws of host countries.","x":"It shall be ensured that all laws of the Central Tibetan Administration, executive orders, and its regulations are in compliance with international law and, in particular, with the laws of the host countries.","c":"I","rep":false},{"n":"7","t":"Abjuration of war","s":"Tibet will be a zone of peace; war is rejected as a means to any goal.","x":"The territory of Tibet shall remain a zone of peace and non-violence in the future; the country will strive to never engage in the production of any type of chemical and biological weapons. Starting this present moment, war shall be abjured as a means for achieving any purpose, including the realization of the just cause of Tibet.","c":"I","rep":false},{"n":"8","t":"Citizenship of Tibet","s":"Who is a Tibetan citizen, including those born abroad and foreign spouses.","x":"1) All Tibetans born within the dominion of Tibet as well as all Tibetans born in foreign countries are all citizens of Tibet. Besides, anyone born in a foreign country with anyone of his or her parents being Tibetan shall also be eligible to become a citizen of Tibet.\n\n2) A Tibetan need not give up his or her Tibetan citizenship if due to exigency of circumstances he or she had no choice but to take up the citizenship of another country as long as he or she continues to fulfil without violating the duties of Tibetan citizenship enshrined in Article 13 of this Charter.\n\n3) A citizen of another country being validly married to a Tibetan citizen and having cohabited continuously with his or her Tibetan spouse for more than three years and is desirous of acquiring Tibetan citizenship shall be eligible to do so in accordance with a law for the purpose thereof passed by the Tibetan parliament.\n\n4) For the purpose of implementing the above provisions, the Tibetan Parliament shall adopt a Tibetan Citizenship Act.","c":"I","rep":false},{"n":"9","t":"Equality before law","s":"Everyone is equal before the law, with no discrimination.","x":"All citizens of Tibet are equal before law. They are entitled to enjoy all the conferred rights mentioned in this chapter without discrimination on grounds of sex, race, language, religion, whether lay or clergy13, rich or poor, birthplace, social class, official status and other personal circumstances.","c":"II","rep":false},{"n":"10","t":"Freedom of religious belief","s":"All religions are equal and every Tibetan has freedom of religion.","x":"All religions are equal before law. Each Tibetan is entitled to freely exercise his or her freedom of thought, conscience and religion. Every Tibetan has the right to openly profess, practice, join, teach, propagate or carry out services in any religion of his or her choice, whether alone or in community with others.","c":"II","rep":false},{"n":"11","t":"Right to vote and to stand as candidates for elections","s":"Every citizen aged 18+ can vote; age is taken from the Green Book.","x":"Save in the case of anyone who had been deprived of the right to vote in accordance with the provisions of any law in force at the relevant time, every person who is a citizen of Tibet and who has fully attained eighteen years of age, whether male or female, has the right to vote. Likewise, save in the case of anyone who had been deprived of the right to stand as candidate in accordance with the provisions of any law in force at the relevant time, every person who is a citizen of Tibet has the right to stand as a candidate in elections. According to the rules and regulations, age of an individual shall be determined as mentioned in his/her Greenbook.","c":"II","rep":false},{"n":"12","t":"Other fundamental freedoms and rights","s":"Freedoms of speech, movement, press, assembly, and free legal aid.","x":"Save in the case of restrictions imposed under any law for purposes of the current or long-term fundamental cause or interests of the Tibetan people, or in the case of restrictions imposed by the Tibetan Parliament-in-Exile by law on the officials of the Central Tibetan administration for the duration of their services, all Tibetan citizens are entitled to the following freedoms and rights:\n\n1) Rights to life, personal liberty and property;\n2) Speech;\n3) Movement;\n4) The publication and distribution of newspapers, periodicals and other types of articles;\n5) Peaceful assembly without bearing arms;\n6) To be provided free of charge lawyers and interpreters if needed for litigants during judicial proceedings;\n7) To form and join associations or unions (or co-operatives) whether they are religious, cultural or economic;\n8) Equality of opportunity in the matter of employment under any undertaking of the Central Tibetan Administration commensurate with the level of one’s educational qualification;\n9) To pursue any occupation or trade, buy and sell land and properties, or undertake any other means of livelihood in accordance with the laws of one’s host country; and\n\n10) No child who is yet to attain 14 years of age shall be employed as a manual labourer.","c":"II","rep":false},{"n":"13","t":"Duties of citizens","s":"Citizens' duties: loyalty, following the Charter, the Tibet cause, chatrel.","x":"All Tibetan citizens are enjoined to carry out the following duties:\n\n1) To bear true allegiance to the Central Tibetan Administration;\n2) To bear true faith and abide by to this Charter and the laws made under its provisions;\n3) To strive for the resolution of cause of Tibet.\n4) To pay the voluntary contribution in accordance with the relevant laws thereof.\n5) To carry out any task that may be assigned in accordance with law during emergency situations concerned with the Central Tibetan Administration or the Tibetan people.","c":"II","rep":false},{"n":"14","t":"Effective enforcement of the fundamental rights and duties","s":"You can appeal to the justice commissions if your rights are violated.","x":"In case of violation of any fundamental rights and duties mentioned above, the right to seek remedy by timely appeal to the Tibetan Supreme Justice Commission or its subordinate Commissions, excluding the cases of legal restrictions contained in Article 12, is guaranteed. These justice commissions, in turn, have the power to make such appropriate rulings as may be necessary to secure these rights and duties.","c":"II","rep":false},{"n":"15","t":"Resolving the just cause of Tibet and welfare of Tibetans in exile","s":"The CTA's main goal is to resolve the Tibet issue and help Tibetans in exile.","x":"The main objective of the Central Tibetan Administration is to strive resolving the Tibetan issue. The environment of the Tibetan Plateau is highly critical to the world at large and, especially, to large proportions of the Asian continent and peoples. That being the case, the Central Tibetan Administration and all the Tibetan people should make efforts to undertake as much international campaign actions as possible directed at protecting the environment of Tibet.\n\nIn contemporary terms too, efforts should be directed at protecting the Tibetan people left behind in Tibet from hardship and suffering. Within the Tibetan community in exile, the system of governance should be based on a policy of ensuring the general welfare through justice, equality and fair access to the economic benefits. In particular, efforts should be made to give quality opportunities to the youth in the fields of education and to enable them to imbibe the excellent Tibetan cultural heritage. Efforts should also be made to provide quality health facilities to ensure their sound physical and mental upbringing. In order to achieve this multitude of objectives, the initiatives especially outlined in the following articles should be accomplished.","c":"III","rep":false},{"n":"16","t":"Social welfare","s":"Welfare, livelihoods, equal pay for equal work, and help for those in need.","x":"1) For the purpose of ensuring the social welfare of the Tibetan people in exile, measures must be adopted in attempts to secure their means of livelihood as well as their physical and mental well-being. Policy measures should be adopted to provide equal right to humanitarian relief and equal pay for equal work under the Central Tibetan Administration and its affiliates. The taxation system must ensure equitable dues in accordance with the level of income of the concerned Tibetan tax payer.\n\n2) In the case of those who are chronically ill, handicapped, or whose living conditions are extremely poor that they cannot meet their ends and those who have too many children that they live in poverty and unable to educate their children, arrangements should be made to provide guidance and economic assistance. Efforts must be made in attempts to prevent occurrences of slave labour and economic exploitations.\n\n3) In particular, for the purpose of ensuring that the Tibetan settlements and other types of Tibetan communities do not disintegrate, agricultural works must be modernized and manufacturing projects set up. Public or private cooperatives, handicraft centres, and other types of enterprises shall be set up in accordance with the rules and regulations passed by the Tibetan Parliament.","c":"III","rep":false},{"n":"17","t":"Education and culture","s":"Every Tibetan child of school age should get education; Tibetan culture is protected.","x":"1) Adhering to the Declaration of the Rights of the Child adopted by the United Nations, all Tibetan children in exile who had reached school-going age shall be given the opportunity and access to education.\n\n2) In order to enhance the imparting of education, an ideal education policy meeting the fundamental requirements of Tibet shall be formulated.\n\n3) Efforts should be made to ensure that the children are able to attend as day scholars in schools within their respective settlements or communities and whenever required attempts should be made to set up hostels for the school children.\n\n4) In the case of the children of Tibetans living in other scattered communities, attempts should be made to ensure their admittance in Tibetan schools located nearest to their place of residence.\n\n5) Arrangement must be made to provide expert counselling and guidance to the students to enable them to make the right choices regarding their educational future and career.\n\n6) For those who are economically well off, advice should be provided on financing their children’s higher education until successful completion.\n\n7) Attempts must be made to provide those who had excelled in their studies and conduct with opportunities of further education in specialized fields, vocational courses and college and university degree courses. Efforts must be made to provide scholarships to those who lack the means to pay their fees.\n\n8) Efforts must be made to improve the standard of education in the primary, secondary and higher secondary schools in both private and government schools, whether residential or day schools, attempts shall be made to gradually teach all the subjects in Tibetan language. It shall be made\n\npart of the primary school education curriculum to impart the children the ethical principles taught by Tibet’s religions and religious commentaries.\n\n9) Teachers at all levels of schools should be held in high esteem in society and attempts shall be made to recruit the most learned of people in the teaching community.\n\n10) Efforts should be made to ensure the quality and efficient running of institutions for monks, nuns and tantric practitioners and also to prevent abuse of means to procure facilities befitting the norms. (Attempts should be made to ensure the propriety and quality of the monks, nuns and tantric practitioners of the concerned religious order and measures should be taken to prevent their facilities from being abused.)\n\n11) Moves should be initiated in efforts to promote to a higher level of the noble Buddhist faith in its ecumenical form and without any sectarian bias.\n\n12) Efforts should be made to provide guidance and facilities to the community of monks and nuns to afford them the opportunities to participate in educational, health and other appropriate social service avenues.\n\n13) By fostering and holding in public esteem the master craftsmen and other experts in their respective fields which are in danger of becoming extinct, efforts should be undertaken to preserve and promote the ancient Tibetan culture in general terms and, especially, in the fields of performing arts; the handicrafts and craftsmanship involving the forging, curving or casting of various kinds of materials such as iron, copper, gold and silver.\n\n14) Guidance shall be provided especially in the study of important modern subjects, such as science, and efforts to be made to provide research facilities in the fields of science and art.\n\n15) Support and facilities shall be provided to the centres for preserving and administering religion and culture represented by the monasteries and nunneries, institutions of higher learning, and other types of educational centres.\n\n16) Efforts shall be made to ensure progress in games and athletic endeavours.","c":"III","rep":false},{"n":"18","t":"Health","s":"Public health, hygiene and medical care for Tibetans.","x":"1) To ensure public health, there should be progress in the provision of adequate facilities of hygiene and medical treatment. Efforts should be made to provide free medical treatment to the indigent; special inoculation drives should be launched to prevent chronic ailments and the spread of contagious diseases, specialised medical attention and education on environmental protection should be carried out.\n\n2) In particular, efforts should be made to achieve progress in the traditional Tibetan medical practice, pharmacology, and comparative study and research on Tibetan medicine vis-a-vis modern medical sciences.\n3) In order to standardize the practice of Tibetan medicine, regulation and administration should be carried out in compliance with legal regulations.24\n\na system of legal regulation should be introduced.\n\nThe Executive of the Central Tibetan Administration","c":"III","rep":false},{"n":"19","t":"The Executive Power","s":"Executive power belongs to the Sikyong.","x":"The executive power of the Central Tibetan Administration vested in the Sikyong. He may, in accordance with the provisions of this Charter, exercise this power either directly or through the Kalons and responsible officers on whom he may delegate his power. In particular, the Sikyong may, in exercise of his executive authority:\n\n1) Approve and announce bills and regulations passed by the Tibetan Parliament;\n\n2) Confer honours for exemplary accomplishments as well as present titles and awards;\n\n3) To present proposals, deliver addresses and offer explanations to the Parliament.","c":"IV","rep":false},{"n":"20","t":"The Sikyong and the Kashag","s":"The Sikyong leads a cabinet of ministers called the Kashag.","x":"Under the leadership of the Sikyong, there shall be a council of ministers called the Kashag with responsibility over the administrative and political affairs of the Central Tibetan Administration. The Kashag shall consist of a Sikyong and not more than seven Kalons.","c":"IV","rep":false},{"n":"21","t":"Qualifications of the Sikyong and the Kalons","s":"To be Sikyong or Kalon you must be a citizen aged 35+, among other rules.","x":"A candidate must fulfil the following qualifications to be eligible for election as Sikyong or for being considered for confirmation as a Kalon:\n\n1) Must be a Tibetan citizen;\n2) Must have completed the age of 35 years;\n3) Must not have been declared mentally challenged / unstable by a court of law or a licensed medical practitioner;\n4) Must not be indebted as to have become insolvent;\n5) Must not have been found guilty and sentenced for a criminal offence by a court of law;\n6) Must not have been resolved by the Tibetan Parliament to be ineligible as candidate for Sikyong or Kalon by more than two-thirds majority vote;\n7) Must not be in continuance as Sikyong or Kalon for two consecutive terms;\n8) Must not have been forced to step down as Sikyong or Kalon in accordance with the provisions of sub-clause\n (a) of clause 3 and of clause 4 of Article 29 of this Charter;\n9) Must not be a person involved in any work, or having rank or enjoying pecuniary or material benefits under any other country which may be detrimental to the interest of the Tibetan people.\n10) Must not be contradictive to any of the provisions of the election law or any regulations adopted by the Tibetan Parliament.\n11) Must not be a person who has no trust and confidence in the Charter of Tibetans in Exile, and must not have been proven to have caused damage to the Tibetan cause directly, spontaneously or indirectly.","c":"IV","rep":false},{"n":"21A","t":"Election of the Sikyong","s":"The Sikyong is elected directly by all eligible voters.","x":"The election of the Sikyong shall be held under a law for the purpose passed by the Tibetan Parliament and on the basis of universal suffrage exercised by all citizens of Tibet who are eligible and have the freedom to vote; the winner in such an election should assume the post of the Sikyong.\n\n1) Where in such an election, in case two candidates win equal number of votes, a new round of general voting shall be held with them as the candidates and in accordance with the law for the purpose.\n\n2) In case any member of the Tibetan Parliament gets elected as Sikyong or confirmed as a Kalon, such a member must resign his or her membership of the parliament. Likewise, any staff of the Central Tibetan Administration who gets elected as the Sikyong or confirmed as a Kalon must resign from service. However, after leaving the post as the Sikyong or, as the case may be, Kalon, such a person shall be entitled to all the retirement benefits as may have accrued to him or her under the relevant rules on the basis of his or her service years and rank held before assuming the posts of Sikyong or Kalon.","c":"IV","rep":false},{"n":"22","t":"Election of the Kalons","s":"The Sikyong names up to 7 Kalons; Parliament must approve each one.","x":"The duly elected Sikyong, after having taken his or her oath of office, shall present to the Tibetan Parliament a list of number of candidates as he or she may require for his or her Kashag not exceeding seven, along with their names and personal descriptions, explaining their eligibility for confirmation in accordance with the provisions of Article 21 of this Charter. No question arises if the candidates are confirmed as Kalons by unanimous approval of the parliament. However, in the absence of unanimous approval, secret ballot must be held by the members present in the house with regard to each candidate and a candidate who wins atleast 50 percent of the votes shall be declared as an elected Kalon. The Sikyong shall then appoint such candidates who have been approved unanimously or by not less than 50% votes by the Tibetan Parliament as Kalon. If all or any of the candidates proposed by the Sikyong fail to win at least 50% votes, the Sikyong shall present a fresh list of candidates to the Tibetan parliament in accordance with the above procedure.","c":"IV","rep":false},{"n":"23","t":"Conduct of election of the Kalons","s":"Kalon approval follows Parliament's rules of procedure.","x":"In every case where the Kalons need to be elected as per the provisions of Article 22 of this Charter, the same shall be held under the agenda of the Tibetan Parliament in accordance with the Rules of Procedure and Rules for Conduct of Business of the house.","c":"IV","rep":false},{"n":"24","t":"Tenure of the Sikyong and the Kashag","s":"The Sikyong and Kashag serve a five-year term.","x":"Unless removed from office in accordance with the provisions of this Charter before the end of their tenure, the Sikyong and the Kashag shall continue in office for a term of five years.","c":"IV","rep":false},{"n":"25","t":"Taking of oath of office by the Sikyong and the Kalons","s":"The Sikyong and Kalons take their oath before the Chief Justice Commissioner.","x":"The duly elected Sikyong and the Kalons shall, before assuming their offices, take their oath or affirmation of office and secrecy before the Chief Justice Commissioner of the Tibetan Supreme Justice Commission, in accordance with the format set out for the purpose in Appendix 1A of this Charter.","c":"IV","rep":false},{"n":"26","t":"Salaries and other allowances of the Sikyong and the Kalons","s":"Parliament decides the salaries of the Sikyong and Kalons.","x":"The salaries, allowances and other entitlements of the Sikyong and the Kalons during the tenure of their services shall be as determined in law by the Tibetan Parliament.","c":"IV","rep":false},{"n":"27","t":"The Council of Kashag","s":"The Sikyong chairs Kashag meetings.","x":"The Sikyong is to preside over all meetings of the Kashag. And during the absence of the Sikyong, the Kashag meetings should be presided over by the available Kalon based on the genesis of departments in the list of departments by the official order.","c":"IV","rep":false},{"n":"28","t":"Joint session of His Holiness the Dalai Lama and the Kashag (repealed)","s":"Removed from the Charter.","x":"","c":"IV","rep":true},{"n":"29","t":"The responsibilities and removal of the Kashag","s":"The Kashag is collectively responsible and can be removed by Parliament.","x":"1) The responsibility of the Kashag shall be that of Sikyong and all the Kalons collectively. The Kashag shall be accountable to the Tibetan Parliament to whom it shall routinely present its proposals and answer questions.\n\n2) It shall be for the Sikyong to determine the responsibilities and allocate portfolios of each Kalon.\n\n3)\n (a)The Tibetan Parliament is entitled, by the concurrence of at least two-thirds of the members present, to remove the Sikyong and any particular Kalon or the entire Kashag from the office.\n\n (b) On the death or removal from office of the Sikyong, the entire Kashag shall automatically stand dissolved. When the Sikyong dies, the Kalon available at the time based on the genesis of department in the list of departments by the official order shall officiate as the acting Sikyong in accordance with the provisions of Article 27 of this Charter until a new Sikyong is elected in accordance with the procedure laid down in Article 21A of this Charter.\n\n4) Any Kalon whose resignation from office is demanded by the Sikyong must comply. In such cases, the Sikyong shall give explanations for the removal to the Tibetan Parliament if it happens to be in session or during the parliament’s upcoming session.\n\n5) In the event of removal of the Kashag from office, the Central Tibetan Election Commission shall announce new election dates; election of the Sikyong and the result thereof shall be declared within 120 days from the date of the announcement. In the event of the removal of any particular Kalon from office, the Sikyong shall in accordance with the provisions of Article 22 of this Charter, present the name of his or her proposed replacement Kalon to the Tibetan Parliament if it happens to be in session or during the parliament’s upcoming session.\n\n6) After his or her term of office comes to an end, the existing Sikyong shall continue in office until the new Sikyong takes his or her oath of office. However, in the case of removal of any particular Kalon from office in accordance with the provisions of Clauses (3) and (4) of this Article, such a Kalon must leave office at once. In the case of removal of the entire Kashag from office, the existing Kashag will continue until the new Sikyong takes his or her oath of\n\npresent his justification office. However, during such transitional period, only routine office works could be carried out while taking new policy decisions is forbidden.","c":"IV","rep":false},{"n":"30","t":"Conduct of business of the Central Tibetan Administration","s":"All CTA actions are taken in the name of the Sikyong.","x":"All actions of the Central Tibetan Administration shall be taken in the name of the Sikyong. For the ease of carrying out administrative work, with regard to the manner of taking decisions, and on the manner in which the Kashag and individual departments are to carry out their respective responsibilities, the Sikyong and the Kalons shall formulate detailed regulations and abide by them upon getting passed by the Tibetan Parliament.","c":"IV","rep":false},{"n":"31","t":"Council of Regents (Repealed)","s":"Removed from the Charter.","x":"","c":"IV","rep":true},{"n":"32","t":"Chairman of the Council of Regents (Repealed)","s":"Removed from the Charter.","x":"","c":"IV","rep":true},{"n":"33","t":"Power of the Council of Regents (Repealed)","s":"Removed from the Charter.","x":"","c":"IV","rep":true},{"n":"34","t":"Change of the Regent (Repealed)","s":"Removed from the Charter.","x":"","c":"IV","rep":true},{"n":"35","t":"Terms of service, salary and benefits of the Regent (Repealed)","s":"Removed from the Charter.","x":"","c":"IV","rep":true},{"n":"36","t":"Legislative power","s":"Parliament makes the laws; the Sikyong signs them into force.","x":"All power to draft and pass laws shall reside in the Tibetan Parliament. However, they shall attain the force of law only after they are approved and signed by the Sikyong.","c":"V","rep":false},{"n":"37","t":"Composition of the Tibetan Parliament","s":"Parliament has 45 elected members from provinces, religious schools and regions.","x":"The Tibetan Parliament shall be constituted in the following composition:\n\n1)\n (a)Irrespective of sex, ten members each from each of the three provinces of Tibet determined through election;\n (b)Two members each from the five religious schools of Nyingma, Kagyu, Sakya and Gelug and the Yungdrung Bon religion determined through election;\n (c) Two members from amongst the Tibetans residing in North and South Americas determined through election;\n (d) Two members from amongst the Tibetans residing in Europe and Africa determined through election;\n (e) One member from amongst the Tibetans residing in Asia and Australasia, excluding India, Nepal and Bhutan.\n\n2) With regard to the ten members from each of the three provinces, irrespective of sex, mentioned in Clause (1), at least two each must be females.\n\n3) The Tibetan Parliament is entitled, as and when it sees it fit to do so, to raise the number of different regional electoral constituencies.","c":"V","rep":false},{"n":"38","t":"Qualifications of members of parliament","s":"To stand for Parliament you must be a citizen aged 25+ and not a CTA employee.","x":"To stand for election as a member of parliament, a candidate:\n1) Must be a Tibetan citizen;\n2) Must have completed the age of 25 years;\n3) Must not have been declared to be mentally challenged/ unstable by a court of law or by a licensed medical practitioner;\n4) Must not be so indebted as to have become insolvent;\n5) Must not have been convicted for a criminal offence by a court of law;\n6) Must not be an employee of the Central Tibetan Administration;\n7) Must not be a person involved in any work, or having rank or enjoying pecuniary or material benefits under any other country which may be detrimental to the interest of the Tibetan people;\n8) Must not be contradictive to any of the provisions of the election law or any regulation adopted by the Tibetan Parliament.\n9) Must not be a person who has no trust and confidence in the Charter of Tibetans in Exile, and must not have been proven to have caused damage to the Tibetan cause directly, spontaneously or indirectly.","c":"V","rep":false},{"n":"39","t":"Tenure of the Tibetan Parliament","s":"Parliament's term is five years.","x":"The term of the Tibetan Parliament is five years.","c":"V","rep":false},{"n":"40","t":"Sessions of the Tibetan Parliament","s":"Each regular session must start within six months of the last one.","x":"The parliamentary secretariat shall notify each member of the Tibetan Parliament whenever a regular session of the Tibetan Parliament is to be held. The dates, durations and the venue of parliamentary session should be determined collectively by the Speakers in consultation with the Standing Committee of the Tibetan Parliament. However, it must be ensured that each regular session of the Tibetan Parliament begins within six months from the date of the adjournment of the previous session. However, in case any unavoidable difficulty arises from any incident of epidemic or war or any natural calamity, the parliamentary session may be postponed. And in such a case, the Standing Committee may, within a time fixed for the purpose, examine and finalize the sanction where a budget proposal requires to be presented and approved.","c":"V","rep":false},{"n":"41","t":"Additional sessions of the Tibetan Parliament","s":"Extra sessions can be called on request.","x":"When requested by more than fifty percent of the Kashag, or of the Tibetan Parliament, or of the Standing Committee of the Tibetan Parliament, the Speaker and the Deputy Speaker may jointly decide to call additional sessions of the Tibetan Parliament.","c":"V","rep":false},{"n":"42","t":"Standing Committee of the Tibetan Parliament","s":"A Standing Committee works when Parliament is not in session.","x":"1) When the Tibetan Parliament is not in session, there will be a standing committee which will consist of two members of parliament from each three traditional provinces and one member from each religious school. The different constituencies may determine their choice for membership of the standing committee either by voting amongst themselves or by making\n\nnomination in accordance with their own circumstances. The membership of the standing committee shall be reconstituted annually.\n\n2) Regarding the functioning of the standing committee and the extent of its authority, they shall be determined in accordance with the rules or regulations adopted by the Tibetan Parliament.","c":"V","rep":false},{"n":"43","t":"Address or message by His Holiness the Dalai Lama during sessions of Parliament (Repealed)","s":"Removed from the Charter.","x":"","c":"V","rep":true},{"n":"44","t":"Right of the Sikyong and the Kalons to attend sessions of the Tibetan Parliament","s":"The Sikyong and Kalons can attend and speak in Parliament.","x":"The Sikyong and the Kalons have the right to take part in the sessions of the Tibetan Parliament and of its standing committee, to address, take part in discussions and put forward proposals for discussion. However, they shall have no voting right in the parliamentary sessions.","c":"V","rep":false},{"n":"45","t":"The Speaker and Deputy Speaker of the Tibetan Parliament","s":"MPs elect a Speaker and Deputy Speaker.","x":"1) At the first meeting of each Tibetan Parliament, the members should elect a Speaker and a Deputy Speaker from amongst themselves by secret ballot in accordance with the rules for the purpose.\n\n2) Immediately after their elections, the Speaker and the Deputy Speaker shall, before assuming their offices, take their oath or affirmation of office before the Chief Justice Commissioner of the Tibetan Supreme Justice Commission in accordance with the format set out for the purpose by law in Appendix 3 of this Charter.\n\n3) When the Speaker or the Deputy Speaker is removed as a member of the Tibetan Parliament, or when either of them is removed from office by a resolution for the purpose with the support of at least two-thirds of the total strength of the parliament, the Speaker or, the Deputy Speaker must give up office from that day itself.\n\n4) The Speaker or, the Deputy Speaker, cannot preside over a parliamentary session during which a debate takes place on the question of his or her removal from office for the duration of that debate.\n\n5) Whenever the seat of the Speaker or, the Deputy Speaker of the Tibetan Parliament, becomes vacant by resignation, removal, or death, a replacement must be elected in accordance with the rules for the purpose at earliest.40","c":"V","rep":false},{"n":"46","t":"Privileges of the Members of Tibetan Parliament","s":"MPs cannot be sued for what they say in Parliament.","x":"1) No one is allowed to initiate any legal proceeding in a court of law against any member of Tibetan Parliament for anything said or any vote cast by him or her in the Parliament or in any committee thereof.\n\n2) The Tibetan Parliament shall, from time to time, determine by law the other privileges of its members.","c":"V","rep":false},{"n":"47","t":"Oath taking by members of Tibetan Parliament","s":"How new MPs take their oath.","x":"The Standing Committee of the Tibetan Parliament shall appoint the elected member with the longest record of membership of parliament as the Interim Speaker. In case there are two or more members with equal length of longest parliamentary membership record, the oldest aged among them shall be appointed as the Interim Speaker. After the Interim Speaker had taken his oath of office before the Chief Justice of the Tibetan Supreme Justice Commission, each Member of Parliament shall, before assuming office, take his or her oath or affirmation of office before him in accordance with the format set out for the purpose by law. After the election of the Speaker and the Deputy Speaker, the oath shall be taken before the Speaker. In case the Speaker happens to be absent, the oath shall be taken before the Deputy speaker.","c":"V","rep":false},{"n":"48","t":"Voting during parliamentary sessions","s":"Parliament decides by majority vote; the Speaker breaks ties.","x":"Save as otherwise provided in this Charter, all businesses of the Tibetan Parliament shall be determined by majority vote. In cases of equal votes, the presiding Speaker shall resolve the matter by casting his or her own vote.","c":"V","rep":false},{"n":"49","t":"Quorum to constitute a meeting of the Tibetan Parliament","s":"How many MPs must be present for a valid meeting.","x":"1) Both the Tibetan Parliament and its standing committee shall be entitled to conduct their respective businesses, including in the matter of the election of the Speaker and the Deputy Speaker, if at least two-thirds of their total members are present. However, while calculating the proportion of the number of members present at a meeting, fractional numbers less than one shall not be taken into account.\n\n2) In case a meeting of the Tibetan Parliament had to be adjourned for more than seven days due to the absence of the requisite quorum for the purpose, the Speaker and the Deputy Speaker shall together take a decision to adjourn the meeting.\n\n3) The Tibetan Parliament shall abide by any decision it may have taken notwithstanding the fact that any vacancy had arisen in the membership thereof or upon subsequent discovery that a person who was not entitled to participate in its proceedings had done so, including by voting. However, any person who had participated in a parliamentary proceeding or voted therein without being entitled to do so shall be ineligible as a candidate in any future parliamentary election.","c":"V","rep":false},{"n":"50","t":"Honorarium and daily emoluments for the members of the Tibetan Parliament","s":"Parliament decides MPs' honorarium and allowances.","x":"All members of the Tibetan Parliament shall be entitled to such amount of honorarium and daily allowances as determined by parliament by law and he or she shall be entitled to draw these amounts from the day of taking oath of office until the end of his or her term as a member.","c":"V","rep":false},{"n":"51","t":"Introduction and adoptions of legislative bills","s":"How bills are introduced and passed.","x":"1) Without the recommendation of the Kashag, the Tibetan Parliament shall not introduce any legislative bill which seeks to impose taxes, or give temporary tax concessions or exemptions, or deals with any taxation matter, or accepts for the Tibetan Administration any loan or deals with the giving of guarantees for any such loan. However, no recommendation from the Kashag would be required in all cases in which the legislative bill had already been introduced.\n\nIn such cases, the Tibetan Parliament may amend the relevant provisions dealing with the increase or reduction of taxes or with giving of tax concessions.\n\n2) Finalization of implementations of any legislative bills which would require the Administration to incur expenses shall not be allowed unless it is recommended by the Kashag.\n\n3) Except as provided above, the Tibetan Parliament, or any of its members, shall have the right to introduce any draft legislation or any draft resolution and to present suggestions for amendments to their provisions in accordance with the relevant rules of the Tibetan Parliament.\n\n4) With regard to the question whether any draft legislation or draft resolution deserves to be debated in the Tibetan Parliament, a separate committee may, if felt required, be constituted and the matter referred to it for examination.","c":"V","rep":false},{"n":"52","t":"The annual budget of the Central Tibetan Administration","s":"The Kashag presents the yearly budget for Parliament to approve.","x":"1) Each year the Kashag shall present to the Tibetan Parliament its total annual budget, setting out the total estimates of the income and expenditure of the Central 44Tibetan Administration and all its main and subsidiary offices without anything being set aside or omitted from them. With regard to the Administration’s estimates of annual expenditure in the annual budget, they shall be set out in the following two categories:\n\na) The sums required to meet the expenditure set out in Clause 2 of this Article out of the income of the Central Tibetan Administration; and\n\nb) Other sums proposed to be spent under other heads of expenditure chargeable to the income of the Central Tibetan Administration.\n\n2) The following are the expenditure mentioned in sub-clause\n (a) above required to be charged to the income of the Central Tibetan Administration:\n\na) All expenditure pertaining to His Holiness the Dalai Lama, including his personal security;\n\nb) The honorarium and allowances of the Speaker and the Deputy Speaker of the Tibetan Parliament;\n\nc) The salaries, allowances and retirement entitlements of the Chief Justice Commissioner and the other two Justice Commissioners of the Tibetan Supreme Justice Commission.\n\nd) Repayment of loans and payment of interest on loans of the Central Tibetan Administration48.\n\n3) The specific expenditure mentioned above need not be decided by vote in the Parliament. However, nothing in this clause shall be construed as a bar on the Tibetan Parliament from discussing any of those estimates.\n\n4) With regard to all the other sums required to meet the types of expenditure mentioned above in Sub-clause\n (b) of Clause (1), sanction must be obtained from the Tibetan Parliament in accordance with the rules of procedure on budgetary matters which had been adopted by it. The Tibetan Parliament may assent, enhance or reduce the amounts, or return the demands for grant as it sees fit.","c":"V","rep":false},{"n":"53","t":"Proceeding rules of the Tibetan Parliament","s":"Parliament sets its own rules of procedure.","x":"On the basis of the provisions of this Charter, the Tibetan Parliament shall frame rules of procedure with regard to its meetings and rules for conduct of business and shall adhere to them once they are approved by a majority of at least two-thirds of its members.","c":"V","rep":false},{"n":"54","t":"Restriction on discussion in the Tibetan Parliament","s":"Limits on what Parliament may debate.","x":"No discussion or debate shall take place in the Tibetan Parliament with respect to the removal or conduct of the Chief Justice Commissioner or any of the other two Justice Commissioners of the Tibetan Supreme Justice Commission except after a committee constituted by the Tibetan Parliament for the purpose had submitted its enquiry report thereon.","c":"V","rep":false},{"n":"55","t":"Passing of bills","s":"The Sikyong must sign passed bills within 14 working days.","x":"With regard to the legislative bills and rules passed by the Tibetan Parliament, the Sikyong shall, thereon give assent by signing his or her name within 14 working days from the date of their presentation to him or her.","c":"V","rep":false},{"n":"56","t":"Popular Referendum","s":"A popular referendum can be held on vital policy questions.","x":"For the purpose of taking a decision on an important policy matter pertaining to the fundamental interests of Tibet or of the Tibetan people, a popular referendum may be initiated through the Central Tibetan Election Commission if a call for such a recourse is made by at least two-thirds majority of the total strength of the Tibetan Parliament or at least three-fourths of the combined strength of the Kashag and the Standing Committee of the Tibetan Parliament. With regard to the outcome of such referendum, the Sikyong shall, within 14 working days, make an announcement, setting out his or her recognition of the majority decision and signing his or her name thereon.","c":"V","rep":false},{"n":"57","t":"Removal of a member of the Tibetan Parliament","s":"When and how an MP can be removed.","x":"1) An already elected member of the Tibetan Parliament shall resign from the Tibetan Parliament if he or she loses any of the qualifications listed in Article 38 of this Charter or when at least two-thirds of the total strength of the Tibetan Parliament votes for his or her removal.\n\n2) In a case where such removal takes place or in other circumstances when a member of the Tibetan Parliament resigns from the Tibetan Parliament, or when he or she dies, or when a member gets nominated and confirmed as a Kalon, a replacement member must immediately take his or her oath of office. Such member should come from a reserve list maintained by the Central Tibetan Election Commission for the concerned constituency on the basis of the required minimum number of votes won by the candidates who did n
