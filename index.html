ot make it to the Parliament during the last general election and who had the highest number of votes among those in the existing reserve list. However, where no such member exists in a concerned reserve list, election must be held to fill the vacancy within 180 days from the date a seat falls vacant.\n\nHowever, if due to inevitable circumstances resulting from reasonable causes such an election could not be held within the period prescribed above, the Chief Election Commissioner of the Central Tibetan Election Commission may postpone the election. In such case, the Chief Election Commissioner must seek approval for the postponement from the Tibetan Parliament if it happens to be in session or during the immediate next session of the Tibetan Parliament through a petition containing a detailed explanation of reasons for the same. And the election must then be concluded within the period allowed by the Tibetan Parliament.","c":"V","rep":false},{"n":"58","t":"Justice Commission not to enquire into proceedings of Parliament","s":"Courts cannot question Parliament's internal proceedings.","x":"1) The Tibetan Justice Commission shall not question the validity of any proceedings or whether any decisions arrived in the Tibetan Parliament are in conformity with the relevant rules of the parliament.\n\n2) With regard to the exercise of powers conferred under this Charter for the purposes of drafting procedural or substantive rules, no member of the Tibetan Parliament shall be subject to the jurisdiction of any Tibetan Justice Commission.","c":"V","rep":false},{"n":"59","t":"Special General Convention","s":"A Special General Convention can gather public views on urgent issues.","x":"1) When an occasion arises necessitating the holding of debate by the general public on an urgent or important matter, the Kashag, the Speaker and the Deputy Speaker of the Tibetan Parliament may call a special general convention of the Tibetan public after holding a discussion for the purpose.\n\n2) For such type of meeting, the participants shall be constituted, apart from the members of the Tibetan Parliament, by such number of delegates from such sources, with such agenda, on such dates, and at such venue as may be determined either by a joint sitting of the Kashag and the Tibetan Parliament or by the Kashag and the Standing Committee of the Tibetan Parliament.\n\n3) Once the sources of the delegates and their numbers, the agenda, the dates and the venue for the meeting have been determined, the secretariat of the Tibetan Parliament shall send out a notification for holding the meeting 45 days before the date of the start of the meeting.","c":"V","rep":false},{"n":"60","t":"Local committees of the Tibetan Freedom Movement","s":"Local Tibetan Freedom Movement committees in every exile community.","x":"1) In every place in exile where Tibetans live, a local committee of the Tibetan Freedom Movement shall be established. Each such committee shall be constituted with members not less than 3, and not exceeding 11 members, elected by the local Tibetan people in accordance with the relevant rules for the purpose. Each such committee shall work for the accomplishment of objectives beneficial toward efforts to resolve the just cause of Tibet and for progress in the ethical character and material well-being of the Tibetan people through direct collaboration with the Tibetan Parliament.\n\n2) Establishment of new local committees of the Tibetan Freedom Movement, or closing down of existing ones, or merging of existing committees, shall all be carried out in compliance with directives from the Tibetan Parliament.\n\n3) With regard to the local committees of the Tibetan Freedom Movement, conduct of works, and collection of voluntary contribution and remittance works, the Tibetan Parliament shall exercise direct jurisdiction and conduct enquiries.\n4) Where a committee of the Tibetan Freedom Movement as provided in the Clause (1) of this article could not be set up, the Tibetan Parliament may grant special permission for the continuance of whatever arrangement may already be in existence for the concerned area.","c":"V","rep":false},{"n":"61","t":"Secretariat of the Tibetan Parliament","s":"Parliament has a permanent secretariat.","x":"There shall be a permanent secretariat of the Tibetan Parliament with a Secretary General and other number of staff as may be required shall be determined through consultation between the Speaker, the Deputy Speaker and the Kashag and to be appointed or recruited as per the relevant rules for the purpose.","c":"V","rep":false},{"n":"61A","t":"Office of legal matters","s":"Parliament may set up an office on legal matters.","x":"Under the supervision of the secretariat of the Tibetan Parliament, an office on legal matters may be set up. The role of this office would be to provide guidance to the Kashag and the Tibetan Parliament as well as individual Kalons and individual Tibetan Parliament members on general legal matters and matters concerned with the drafting of bills.","c":"V","rep":false},{"n":"62","t":"The Supreme Justice Commission","s":"The Supreme Justice Commission is the highest court of the CTA.","x":"In keeping with the special requirements to appropriately meet the transient current situation of the Central Tibetan Administration and the Tibetan public, there shall be a Tibetan Supreme Justice Commission. The Tibetan Supreme Justice Commission shall consist of one Chief Justice Commissioner and two other Justice Commissioners until the Tibetan Parliament by law may requires to increase the numbers.","c":"VI","rep":false},{"n":"63","t":"Justice Commissioners of the Tibetan Supreme Justice Commission","s":"How the Chief Justice Commissioner and two Justice Commissioners are chosen.","x":"1) Whenever a vacancy arises for the post of the Chief Justice Commissioner and for any of the two other Justice Commissioners, the Chief Justice Commissioner, the Speaker and the Deputy Speaker of the Tibetan Parliament, and the Sikyong shall together constitute an ad hoc nomination committee of three or five members who shall propose a list of candidates whose number shall not be less than twice the number of vacancies to be filled. While it bears no mentioning that the presence of all the above persons would be ideal, in case a meeting of all of them could not be held, it would suffice if those who are actually present constitute the ad hoc nomination committee. The Tibetan Parliament shall then vote on this list and those who win a majority of the votes shall be considered as having won the election as the Chief Justice Commissioner or, as a Justice Commissioner of the Tibetan Supreme Justice Commission.\n\n2) The Chief Justice Commissioner and the other two Justice Commissioners of the Tibetan Supreme Justice Commission must be:\n\na) A citizen of Tibet\n\nb) Must have completed the age of 50 years\n\nc) Must have been a judge in any court for a continuous period of 5 years, or has been an experienced advocate standing for at least 10 years. However, for a period of 30 years from the coming into force of this Charter, the provisions of this sub-clause on appointment of the Chief Justice Commissioner and the other two Justice Commissioners need not be adhered to.\n\n3) Immediately after election, before assuming post, the new Chief Justice Commissioner shall take his or her oath or affirmation of office in accordance with the legally prescribed format before the out-going Chief Justice Commissioner or, the officiating chief justice commissioner. As for the other two Justice Commissioners, they shall, immediately after their election, before assuming post, take their oath or affirmation of office in accordance with the legally prescribed format before the Chief Justice Commissioner.\n\n4) Unless removed from office with a resolution for impeachment initiated by two-thirds majority of the total members of the Tibetan Parliament-in-Exile, the term of the Chief Justice Commissioner is five years or until the completion of 65 years of age, whichever is earlier. The tenure of the other two Justice Commissioners shall continue to remain in office until the completion of 65 years of age.\n\n5) An individual who had left service as the Chief Justice Commissioner or as a Justice Commissioner of the Tibetan Supreme Justice Commission, whether due to retirement or removal from service, is not allowed to serve in an office of profit under the Central Tibetan Administration.\n\n6) If Chief Justice Commissioner of the Tibetan Supreme Justice Commission takes leave from office for a fixed period of time, a replacement shall be appointed in accordance with rules framed under the provisions of Article 67 of this Charter.","c":"VI","rep":false},{"n":"64","t":"Jurors","s":"Jurors can assist the justice commissioners.","x":"1) For the purpose of assisting the Chief Justice Commissioner and the two other Justice Commissioners of the Supreme Justice Commission in the discharge of their judicial works, a committee of jurors made up of not more than three members may be constituted if required. The members of this committee shall be appointed by the Chief Justice Commissioner in consultation with the Kashag. At least two of the three members of the committee of jurors shall be an individual with degree in law obtained from a recognized law school. The term of the committee of jurors shall not be more than three years. However, there is no bar on reappointing them after their tenures.\n\n2) Whenever required in any judicial proceeding of particular importance, an impartial jury of nine members having familiarity with the case may be directly appointed by the Chief Justice Commissioner and they shall serve in addition to the members of the committee of jurors.","c":"VI","rep":false},{"n":"65","t":"Salaries and other allowances of the justice commissioners","s":"Salaries and benefits of the justice commissioners.","x":"1) The salaries, perquisites, pensions and other entitlements of the Chief Justice Commissioner and the other two Justice Commissioners of the Tibetan Supreme Justice Commission shall be as determined in law by the Tibetan Parliament.\n\n2) The salaries, perquisites and retirement entitlements of the Chief Justice Commissioner and the other two Justice Commissioners of the Tibetan Supreme Justice Commission are barred from being altered or reduced to cause adverse impact on their recipient.","c":"VI","rep":false},{"n":"66","t":"Powers of the Tibetan Supreme Justice Commission","s":"What cases the Supreme Justice Commission can hear.","x":"1) The Tibetan Supreme Justice Commission shall be the justice commission of final appeal for both private and public disputes of exiled Tibetans. It shall be the apex judicial organ of the Central Tibetan Administration.\n\n2) Although for the period the Tibetan people remain in exile, the jurisdiction of the courts of the concerned host countries prevails, thereby obviating the assumption of power with regard to criminal as well as land and building property cases, the role of the Tibetan Supreme Justice Commission shall lie in the following areas:\n\na) Resolving disputes arising from the interpretation of the provisions of the Charter of Tibetans-in-Exile; and\n\nb) Resolving disputes based on the manner of discharge of functions by the offices or officials under the executive organ of the Central Tibetan Administration and allegations of unfairness in regard thereto;\n\nc) Resolving disputes with regard to service matters and service benefits concerned with officials of the Central Tibetan Administration;\n\nd) Resolving disputes involving land and housing in the Tibetan settlements;\n\ne) Resolving disputes within the Tibetan society and disputes concerned with security within the Tibetan society;\n\nf) Resolving other disputes not included in the above list as an impartial tribunal through judicial proceeding.\n\ng) In addition, the Tibetan Supreme Justice Commission has the power to conduct enquiries, provide guidance and exercise supervisory control over the functioning and administration of the subordinate Tibetan justice commissions and other offices concerned with legal matters.","c":"VI","rep":false},{"n":"67","t":"Judicial code and procedure of the Supreme Justice Commission","s":"The Justice Commission sets its judicial code and procedures.","x":"In accordance with the relevant provisions of this Charter and any law passed by the Tibetan Parliament, the Tibetan Supreme Justice Commission may draft its judicial code and code of judicial procedure which should be unanimously approved by the Chief Justice Commissioner and the other two Justice Commissioners. It will begin implementing them after being presented to and approved by the Tibetan Parliament.","c":"VI","rep":false},{"n":"68","t":"Supreme Justice Commission to give legal opinions (Repealed)","s":"Removed from the Charter.","x":"","c":"VI","rep":true},{"n":"69","t":"Subordinate Tibetan justice commissions","s":"Local justice commissions can be set up in settlements.","x":"1) The Tibetan Supreme Justice Commission may vest judicial power in the local Tibetan settlement officer, or other officials, or any other capable person to ensure carrying out by them in accordance with the existing local situation the functions of a permanent, temporary, or, mobile subordinate justice commission.\n\n2) The Chief Justice Commissioner of the Tibetan Supreme Justice Commission may, in consultation with the other two Justice Commissioners, appoint such number of jurors and impartial jury members for the subordinate justice commissioners or for any particular subordinate justice commissioner as may be seen appropriate and necessary from time to time.","c":"VI","rep":false},{"n":"70","t":"Office on legal matters (Repealed)","s":"Removed from the Charter.","x":"","c":"VI","rep":true},{"n":"71","t":"Types of Tibetan settlements in exile","s":"Types of settlements: agricultural, handicraft, religious and more.","x":"1) Agricultural settlements;\n2) Handicraft settlements and handicraft cooperatives;\n3) Religious institutions;\n4) Schools and institutes 54;\n5) Self-supporting cluster communities;\n6) Scattered Tibetans living away from Tibetan communities;\n7) Tibetans living in other places.","c":"VII","rep":false},{"n":"72","t":"Settlement officer and Assistant Settlement officer","s":"Each settlement has a Settlement Officer.","x":"Each Tibetan settlement shall have a Settlement officer and, in the case of the large settlements, an Assistant Settlement officer as well.\n\n1) All Tibetans, whether lay or clergy, male or female, in the concerned settlements who fulfil the eligibility conditions and qualifications specified in Articles 11 and 38 of this Charter have the right to vote and to stand as candidates for election as Settlement officer. However, representatives of office of His Holiness the Dalai Lama are not required to be elected.\n\n2) An Assistant Settlement officer, wherever necessary, need not be determined through direct election. Rather, he or she may be elected by the concerned Local Tibetan Assembly through voting. However, to be considered elected winner must have two-third of the number of votes of the total strength of the local assembly.","c":"VII","rep":false},{"n":"73","t":"Election of the Settlement officer","s":"Residents elect their Settlement Officer in two rounds.","x":"1) The Tibetan public in each of the concerned local Tibetan settlement shall initially vote for a preliminary list of possible candidates.\n\n2) A final list of 2 candidates arranged in descending order of the number of votes obtained by them shall be drawn up and the Tibetan public shall cast their votes in a final election.\n\n3) When any member of the concerned local assembly or any locally recruited official of the concerned settlement gets elected as the Settlement officer or as Assistant Settlement officer, he or she shall vacant their previous posts.","c":"VII","rep":false},{"n":"74","t":"Settlement officer and Assistant appointed by the Central Tibetan Administration","s":"When the CTA appoints a Settlement Officer instead.","x":"1) Where the local Tibetan residents do not fulfil the requisite conditions, or where it had emerged that the local Tibetan residents were not willing to hold an election for the time being; or\n\n2) Where the elected Settlement officer proves to be incompetent, or where it has emerged that he or she is disapproved by the majority of the local Tibetan residents, and at the same time, the local Tibetans are not willing to go for an election, the Central Tibetan Administration shall require to appoint either, Settlement officer and the Assistant Settlement officer or both.","c":"VII","rep":false},{"n":"75","t":"Replacement of Settlement officer appointed by the Central Tibetan Administration","s":"Replacing a CTA-appointed Settlement Officer.","x":"In any Tibetan settlement while a Settlement officer and an Assistant Settlement officer appointed by the Central Tibetan Administration continue to be in office, a candidate emerges from amongst the local residents fulfilling the conditions for being elected to these posts, the Local Tibetan Assembly shall, upon sending an application to the Central Tibetan Administration, scrutinize the same and follow it up by replacing the existing Settlement officer.","c":"VII","rep":false},{"n":"76","t":"Tenure of an elected Settlement officer","s":"Settlement Officers serve a three-year term.","x":"1) The term of office of a Settlement officer and an Assistant Settlement officer is three years, unless as per relevant rules, he or she had to be removed from office before his or her term comes to an end.\n\n2) There shall be no objection to a Settlement officer and, as the case may be, an Assistant Settlement officer being re-elected unless he or she had to be removed from office under the provisions of Article 91 of this Charter.\n\npolled","c":"VII","rep":false},{"n":"77","t":"Responsibilities of a Settlement officer and an Assistant Settlement officer","s":"What Settlement Officers are responsible for.","x":"1) All matters pertaining to administration of the concerned settlements;\n\n2) Judicial works assigned by the Tibetan Supreme Justice Commission;\n\n3) To respectfully abide by the laws of the local community and to respect their customs and traditions as to ensure harmonious coexistence and tranquillity amongst the Tibetans themselves and between the Tibetans and the public of the local community;\n\n4) To carry out the work that may be assigned by any of the Central Tibetan Administration offices, the Tibetan Parliament, the Kashag and the relevant departments in accordance with existing rules and regulations;\n\n5) In addition, to adhere and implement, in accordance with existing rules and regulations, whatever measures may be required for the benefit of the Tibetan public in consonance with the prevailing conditions.","c":"VII","rep":false},{"n":"78","t":"The Local Tibetan Assembly","s":"Each settlement has a Local Tibetan Assembly.","x":"1) There shall be a Local Tibetan Assembly in each Tibetan settlement.\n\n2) a) With regard to the constituent representation of its members, all Tibetans, whether lay or clergy, male or female, who are residents of the concerned settlement shall have the right to vote and to stand for election as provided under Articles 11 and 38 of this Charter;\n\nb) In case a Local Tibetan Assembly cannot be constituted with members with qualifications provided\n (a) above, the local Election Commissioner may, based on the population size of the settlement, monasteries and other scattered Tibetans of the locality to determine the number of members required for the Local Tibetan Assembly and then the residents of the locality will cast their votes to elect the members.\n\nc) In the case of a dispute between the\n (a) and\n (b) above as to which one the candidate(s) belongs, residents of the locality will conduct a referendum and the one with more votes will prevail.","c":"VII","rep":false},{"n":"79","t":"Quorum and tenure of a Local Tibetan Assembly","s":"A Local Assembly has 7 to 35 members.","x":"1) The strength of a Local Tibetan Assembly shall not be less than 7 and not exceeding 35, depending on the size of the population of the concerned Tibetan settlement.\n\n2) The term of a Local Tibetan Assembly is three years unless it had to be dissolved due to intervening circumstances before the end of its term.","c":"VII","rep":false},{"n":"80","t":"The Speaker and Deputy Speaker of a Local Tibetan Assembly","s":"Local Assemblies elect a Speaker and Deputy Speaker.","x":"1) At the commencement of the first session of the concerned Local Tibetan Assembly, the members should elect, a Speaker and a Deputy Speaker amongst themselves, by majority vote through a secret ballot.\n\n2) The Speaker and the Deputy Speaker shall, before assuming responsibilities, take their oath or affirmation of office before the Local Justice Commissioner, in accordance with the format set out in this Charter.\n\n3) When the Speaker or the Deputy Speaker is to be removed from office by a majority vote of at least two-thirds of the membership of the Local Tibetan Assembly, or whenever their seats fall vacant, an election must be held in accordance with the provision of the law to install their replacements.","c":"VII","rep":false},{"n":"81","t":"Conducts of election","s":"Local elections follow the Tibetan election law.","x":"In accordance with the provisions of the election law of the Tibetans in exile, conduct of all election on local ground shall be the responsibility of the concerned Local Tibetan Election Commission.","c":"VII","rep":false},{"n":"82","t":"Power of the Local Tibetan Assembly","s":"Local Assemblies make local rules.","x":"All powers related to drafting rules and regulations and to pass them, vests in the concerned Local Tibetan Assembly. However, before passing them, consultations must be held with the Settlement officer and the Assistant Settlement officer.","c":"VII","rep":false},{"n":"83","t":"Voting in the Local Tibetan Assembly","s":"How Local Assemblies vote.","x":"Except for the laws and regulations that are especially provided by the Tibetan Parliament, the Local Tibetan Assembly shall decide on all other matters through debate either by unanimous","c":"VII","rep":false},{"n":"84","t":"Quorum of the Local Tibetan Assembly","s":"How many members must be present for a Local Assembly decision.","x":"A Local Tibetan Assembly shall have the competence to take decisions on all matters as long as at least two-thirds of the total strength of its members are present during the session. However, while calculating the quorum, fractional numbers shall not be taken into account.","c":"VII","rep":false},{"n":"85","t":"Emolument and other allowances of the members of the local assemblies","s":"Allowances for Local Assembly members.","x":"Members of the Local Tibetan Assembly shall be entitled to such emoluments and conveyance allowances as may be determined in law by the Tibetan Parliament.","c":"VII","rep":false},{"n":"86","t":"Annual budgets of the settlements","s":"How settlement budgets are made.","x":"The office of the Settlement officer shall draft the estimates of the total income and, expenditure for financial year in an annual budget proposal and present during the budget session. Two different sections of the proposed annual budgets are as follow:\n\n1) Settlements officer's salaries and the administrative expenses of the settlements with no source of income are to be wire by the Central Tibetan Administration.\n\n2) The salaries of the Assistant Settlement officers and other proposed expenditures are to be met from the income generated by the settlements themselves, with regard to which the Local\n\nTibetan Assembly may decide whether to sanction, reduce, or altogether reject the amounts of the budgetary proposals as it may deem fit.","c":"VII","rep":false},{"n":"87","t":"Proceeding Rules of the local assembly","s":"Local Assemblies set their own rules of procedure.","x":"Each Local Tibetan Assembly shall, in accordance with the relevant provisions of the Charter, draft rules for the proceeding of its sessions and the procedure for the conduct of its business, and it shall be implemented after being approved by two-thirds of the members present at the session. With the approval of two-thirds of the members present, the rules and any of the provisions therein could be amended.","c":"VII","rep":false},{"n":"88","t":"Right of the Settlement officers to attend Local Assembly sessions","s":"Settlement Officers may attend Local Assembly sessions.","x":"The Settlement officer and the Assistant Settlement officer have the right to attend the sessions of the Local Tibetan Assembly, take part in discussions, answering questions, and to clarify. However, they shall have no voting right.","c":"VII","rep":false},{"n":"89","t":"Right to present motions","s":"All Local Assembly members can make motions.","x":"All members of the Local Tibetan Assembly have the equal right to offer suggestions and present motions on any matters pertaining to the conduct of affairs of the settlement, and its rules, regulations and laws. However, a non-member desiring to present motions on any of the above matters can do so only through a member.","c":"VII","rep":false},{"n":"90","t":"Restriction on discussion in a Local Tibetan Assembly","s":"Limits on what Local Assemblies may debate.","x":"1) No discussion or debate shall be held in a Local Tibetan Assembly with regard to any person already working as Justice Commissioner or with respect to any matter being examined by a committee of the Local Tibetan Assembly unless a motion had been approved by at least two- thirds of the total strength of the assembly calling for the removal of the local Tibetan Justice Commissioner.\n\n2) However, final approval must be sought from the Chief Justice Commissioner of the Tibetan Supreme Justice Commission in case the Local Tibetan Assembly arrives at a final decision to remove a local justice commissioner.","c":"VII","rep":false},{"n":"91","t":"Removal of a Settlement officer and Assistant Settlement officer","s":"How a Settlement Officer can be removed.","x":"1) In case a resolution to remove the Settlement officer from office had been adopted by a majority of at least two-thirds of the total strength of the concerned Local Tibetan Assembly, the decision shall be taken on the basis of majority votes of the residents of the settlement.\n\n2) With the approval of at least two-thirds of the total strength of the concerned Local Tibetan Assembly, the Assistant Settlement officer can be removed from office.\n\n3) In that cases, an opportunity and right must be accorded to the concerned individual to be heard at the Local Tibetan Assembly before the final decision is taken by vote.","c":"VII","rep":false},{"n":"92","t":"Dissolution of a Local Tibetan Assembly or removal of any of its members","s":"How a Local Assembly can be dissolved.","x":"1) In case the Settlement officer and, the Assistant Settlement officer, in consultation with the Speaker and Deputy Speaker, deem it fit to dissolve the whole members of concerned Local Tibetan Assembly, the decision shall be taken on the basis of majority vote by the residents of the settlement.\n\n2) Or, in case a particular member of the Local Tibetan Assembly to be removed as a member, the decision should be taken by majority vote among the rest of the members.\n\n3) In case, the local assembly is dissolved or a particular member is removed, new members Must be elected/ constituted within 30 days.","c":"VII","rep":false},{"n":"93","t":"Ownership and management of the co-operatives","s":"Who owns and runs the settlement co-operatives.","x":"1) Ownership of the Federation of Tibetan Co-operatives in the settlements shall rest in the local Tibetan co-operatives holding shares in their capital investments and ownership of the local Tibetan co-operatives rest in the local Tibetans holding shares.\n\n2) In accordance with the provisions of the co-operative's Memorandum and Articles of Association, excluding the amounts set aside to meet the future fund requirements, the surplus income generated by the Federation of Tibetan Co-operatives and Local co-operatives should be used solely for the benefit of the shareholders or residents of the concerned settlements.\n\n3) Concerning the Plans and conduct of business of the co-operatives, the co-operatives shareholders, the Local Tibetan Assembly and the concerned settlement officers shall be frequently notified and consulted.","c":"VII","rep":false},{"n":"94","t":"The Local Tibetan Justice Commission","s":"Local Justice Commissions in settlements.","x":"In accordance with the Article 69 of this Charter, a permanent or provisional local justice commission may be set up in each Tibetan settlement. The justice commissioners for such Local Justice Commissions shall be appointed by the Supreme Tibetan Justice Commission, giving the appointment to anyone it deems qualified for the post.","c":"VII","rep":false},{"n":"95","t":"Formation of new Tibetan scattered communities","s":"How scattered Tibetan communities organise themselves.","x":"With regard to Tibetans settled in area with no settlement office and Local Tibetan Assembly\n\n1) In accordance with the provisions of Article 78 of this charter, a permanent settlement in an area comprised of 50 to 150 Tibetan families or has a population of 200 to 600 Tibetan residents with a steady and reliable source of income within the local area (can set up) a Local Tibetan Assembly.\n\n2) Settlement consists of more than 150 Tibetan families, or has a population of more than 600 Tibetan residents, both settlement office and a Local Tibetan Assembly can be set up in accordance with the Article 72 and 78 of this Charter.\n\n3) However, a concerned office of the Central Tibetan Administration must carry an investigation with due care and diligence in regards to whether any particular area fulfils the conditions prescribed above.)","c":"VII","rep":false},{"n":"96","t":"The Central Election Commission","s":"An independent Central Election Commission runs all elections.","x":"There shall be an independent Central Election Commission with the responsibility to carry out all works related to the election of the members of the Tibetan Parliament, the Speaker and the Deputy Speaker, the Sikyong, and for all other election-related matters specified in the Charter and, likewise, for conducting the voting in all cases where issues of vital importance pertaining to Tibet and the Tibetan people have to be decided through referendum.","c":"VIII","rep":false},{"n":"97","t":"The Chief Election Commissioner and its powers","s":"How the Chief Election Commissioner is chosen and their powers.","x":"1) ((a)There shall be a Chief Election Commissioner at the Central Tibetan Election Commission. Whenever a vacancy occurs for this post, the Chief Justice Commissioner of the Tibetan Supreme Justice Commission, the Speaker and the Deputy Speaker of the Tibetan Parliament, and the Sikyong shall together constitute an ad hoc nomination committee of three members solely for the purpose of drawing up a list of candidates numbering at least twice the number of the post to be filled. While it bears no mentioning that the presence of all the above persons would be ideal, in case a meeting of all of them could not be held, it would suffice if those who are actually present constitute the ad hoc nomination committee. The Tibetan Parliament shall vote on the list submitted by the nomination committee and the candidate who wins majority number of the votes as compared to the other candidate(s) shall considered having won the election as the Chief Election Commissioner. Regarding other staff that may be required for the office of the Central Election Commission, the Kashag may make appointments from time to time in consultation with the Chief Election Commissioner of the Central Election Commission.\n\n (b) In case a new Chief Election Commissioner needs to be appointed at a time when the Tibetan Parliament is not in session, the candidates listed by the nomination committee specified above shall be voted on by the Standing Committee of the Tibetan Parliament and the candidate who wins at least two-thirds of the votes of the total strength of the Standing Committee shall be appointed as the new Chief Election Commissioner.\n\n2)\n (a) As and when the Sikyong and the Tibetan Parliament elections are to be held, two Additional Election Commissioners shall be required; they will servefor the period from the announcement of the start of the election process until the declaration of the final voting results. For this purpose, the Chief Justice Commissioner of the Tibetan Supreme Justice Commission, the Speaker and Deputy Speaker of the Tibetan Parliament, and the Sikyong shall together constitute an ad hoc nomination committee of three members solely for the purpose of drawing up a list of candidates numbering at least twice the number of posts to be filled. The Tibetan Parliament shall vote on the list submitted by the nomination committee and the candidates who win the majority of the votes shall be considered having won the election as the Additional Election Commissioners. Alternatively, the nomination committee may propose or support a proposal to vest in the Chairman of the Tibetan Public Service Commission and the Auditor General of the Central Tibetan Administration additional responsibilities as Additional Election Commissioners and they shall be so appointed if approved by the Tibetan Parliament by majority vote.\n\n (b) In case the Additional Election Commissioners need to be appointed at a time when the Tibetan Parliament is not in session, the candidates listed by the nomination committee specified above shall be voted on by the Standing Committee of the Tibetan Parliament and the two candidates who win two-thirds of the votes of the total strength of the Standing Committee shall be appointed as the Additional Election Commissioners.\n\n (c) The Chief Election Commissioner and the Additional Election Commissioners of the Central Election Commission shall, before assuming their offices, take an oath or affirmation before the Chief Justice Commissioner of the Supreme Justice Commission, in accordance with the format set out in the Appendix 5 of this Charter.\n\n3) From the appointment of the Additional Election Commissioners until the end of the announcement of the election results, all election-related decisions shall be taken either unanimously or through majority vote amongst the Chief Election Commissioner and the two Additional Election Commissioners of the Central Election Commission. The Chief Election Commissioner shall preside over all meeting of the Central Election Commission.\n\n4) The Election Commission shall exercise its powers and conduct its duties according to the relevant laws passed by the Tibetan Parliament.\n\n5) In accordance with the relevant provisions of this Charter, the Central Election Commission shall draft comprehensive election rules meant for general application and implement the same on the basis of its approval by the Tibetan Parliament.\n\n6) All disputes related to election matters shall be enquired into and decided upon by the Central Election Commission. In case where the decision of the Central Election Commission is not in agreement, an appeal can be filed only before the Tibetan Supreme Justice Commission, excluding any other Justice Commission.\n\n7) With regard to any dispute related to local ground elections, the Local Election Commission may conduct the enquiry and take the decision. If the decision of the Local Election commission is not in agreement, an appeal can be filed before the Central Election Commission but if the decision is still in disagreement, further appeal can be filed before the Tibetan Supreme Justice Commission.","c":"VIII","rep":false},{"n":"98","t":"Salary and other allowances of the Chief Election Commissioner","s":"Salary and benefits of the Chief Election Commissioner.","x":"1) The Chief Election Commissioner of the Central Election Commission shall be entitled to such salary, perquisites, pension and other entitlements as may be determined in law by the Tibetan Parliament.\n\n2) The salaries, perquisites and retirement entitlements of the Chief Election Commissioner of the Central Election Commission are barred from being altered or reduced to cause adverse impact on the recipient.\n\n3) Where the Additional Election Commissioners are people serving in additional responsibilities, there will be no need to provide for additional salaries, perquisites, pensions and other entitlements for them. However, with regard to Additional Election Commissioners appointed specifically for conduct of election, they shall be entitled to the same amounts of salaries, perquisites and other entitlements and facilities as the Chief Election Commissioner to the exclusion of pension.","c":"VIII","rep":false},{"n":"99","t":"Tenure of the Chief Election Commissioner of the Central Election Commission","s":"Term and removal of the Chief Election Commissioner.","x":"1) Unless a resolution to remove the Chief Election Commissioner from the office has been passed with at least two-thirds of the total members of the Tibetan Parliament, tenure of the Chief Election Commissioner is five years or the completion of 65 years of age, whichever is earlier.\n\n2) An individual who served as the Chief Election Commissioner of the Central Election Commission shall not be allowed to take up any office of profit under the Central Tibetan Administration after retirement or removal from the office.","c":"VIII","rep":false},{"n":"100","t":"The Public Service Commission","s":"An independent Public Service Commission selects CTA staff.","x":"There shall be an independent Public Service Commission responsible for the selection and appointment of both section A and section B as per the Central Tibetan Administration’s staff statutory.","c":"IX","rep":false},{"n":"101","t":"Formation of the Public Service Commission","s":"How the Public Service Commission is formed.","x":"1) The Public Service Commission shall have a Chairman and two to four other members. As and when vacancies occur for these posts, the Chief Justice Commissioner of the Tibetan Supreme Justice Commission, the Speaker and the Deputy Speaker of the Tibetan Parliament, and the Sikyong shall together constitute an ad hoc nomination committee of three members solely for the purpose of drawing up a list of candidates numbering at least twice the number of the posts to be filled. While it bears no mentioning that the presence of all the above persons would be ideal, in case a meeting of all of them could not be held, it would suffice if those who are actually present constitute the ad hoc nomination committee. The Tibetan Parliament shall vote on the list submitted by the nomination committee and the candidates who win the majority of the votes shall be considered as the elected Chairman of the Public Service Commission or, as a member of the Public Service Commission.\n\n2) In case the Chairman or any member of the Public Service Commission needs to be appointed at a time when the Tibetan Parliament is not in session, the candidates listed by the nomination committee specified above shall be voted on by the Standing Committee of the Tibetan Parliament and the candidate who wins at least two-thirds of the votes of the total strength of the Standing Committee shall than be appointed as the chairman.\n\n3) The Chairman and the members of the Public Service Commission shall, before assuming their offices, shall take an oath or affirmation of offices before the Chief Justice Commissioner of the Tibetan Supreme Justice Commission, in accordance with the format set out for the purpose in Appendix 6 of this Charter.","c":"IX","rep":false},{"n":"102","t":"Powers and duties of the Public Service Commission","s":"Powers and duties of the Public Service Commission.","x":"In accordance with the relevant laws passed by the Tibetan Parliament, the Public Service Commission shall frame and implement rules for the selection and appointment, training,\n\nentitlements, and duties of both section A and section B as per the Central Tibetan Administration’s Staff Statutory.","c":"IX","rep":false},{"n":"103","t":"Functioning of the Public Service Commission","s":"The Public Service Commission sets its own working rules.","x":"The Public Service Commission shall frame comprehensive rules regarding its functioning and implement the same in accordance with the law passed by the Tibetan Parliament.","c":"IX","rep":false},{"n":"104","t":"Salary and other allowances of the Chairman of the Public Service Commission","s":"Salary and benefits of the Public Service Commission chairman.","x":"The Chairman of the Public Service Commission shall be entitled to such salary, perquisites, pension and other entitlements as determined in law by the Tibetan Parliament. The salaries, perquisites, honoraria, daily allowances, and retirement entitlements, of the Chairman and members of the Public Service Commission are barred from being altered or reduced to cause adverse impact on their concerned recipients.","c":"IX","rep":false},{"n":"105","t":"Tenure of the Chairman and members of the Public Service Commission","s":"Term of the Public Service Commission members.","x":"1) Term of the chairman and the members of the Public Service Commission is five years or until they attain the age of 65, whichever is earlier\n\n2) The Chairman and any individual member or all the members of the Public Service Commission may be removed from office on the basis of a resolution for the purpose approved by a majority of at least two-thirds of the total strength of the Tibetan Parliament.\n\n3) An individual who had served as the Chairman of the Public Service Commission is not allowed take up any office of profit under the Central Tibetan Administration after the completion of his or her term, retires, or is removed from office.\n\nFunction of the Auditor general","c":"IX","rep":false},{"n":"106","t":"The Office of the Auditor General","s":"An Office of the Auditor General checks CTA accounts.","x":"In accordance with law, excluding the financial accounts of the Office of the Audit Commission itself there shall be an independent Audit Commission for the purpose of auditing all the income and expenditure of all the offices of the Central Tibetan Administration and its units and the accounts of all the organizations funded by the Central Tibetan Administration.","c":"X","rep":false},{"n":"107","t":"Formations of the Office of the Auditor General","s":"How the Auditor General is chosen.","x":"1)\n (a) There shall be an Auditor General who shall be the head of the Audit Commission. Whenever vacancy occurs for this post, the Chief Justice Commissioner of the Tibetan Supreme Justice Commission, the Speaker and the Deputy Speaker of the Tibetan Parliament, and the Sikyong shall together constitute an ad hoc nomination committee of three members solely for the purpose of drawing up a list of candidates numbering at least twice the number of the post to be filled. While it bears no mentioning that the presence of all the above persons would be\n\nideal, in case a meeting of all of them could not be held, it would suffice if those who are actually present constitute the ad hoc nomination committee. The Tibetan Parliament shall than vote on the list submitted by the nomination committee and the candidate who wins the majority of the votes shall be considered as the elected Auditor General of the Audit Commission.\n\n (b) In case the Auditor General of the Audit Commission needs to be appointed at a time when the Tibetan Parliament is not in session, the candidates listed by the nomination committee specified above shall be voted on by the Standing Committee of the Tibetan Parliament and the candidate who secures at least two-thirds of the votes of the total strength of the standing committee shall than be appointed as the Auditor General of the Audit Commission.\n\n2) The Auditor General of the Audit Commission, before assuming his or her office, shall take an oath or affirmation of office before the Chief Justice Commissioner of the Supreme Justice Commission, in accordance with the format set out in the Appendix 7 of this Charter.","c":"X","rep":false},{"n":"108","t":"Powers and duties of Office of the Auditor General","s":"Powers and duties of the Auditor General.","x":"1) In accordance with relevant rules passed Excluding its own financial accounts, the Audit Commission shall have the full power and responsibility to examine, exercise control over and ask questions with regard to all the financial records, including the annual financial accounts and balance sheets, maintained by the Central Tibetan Administration, its subordinate offices, branches, and all organizations funded by the Central Tibetan Administration.\n\n2) The Office of the Auditor General shall exercise its powers and conduct its duties according to the relevant laws passed by the Tibetan Parliament.\n\n3) The Audit work must be completed within seven months from the end of the relevant statutory fiscal year and the certified accounts and audit reports should be returned to the concerned offices. The concerned offices shall in turn present the certified accounts and audit reports, with their clarifications, to the Tibetan Parliament within a period of nine months from the end of the relevant fiscal year.","c":"X","rep":false},{"n":"109","t":"Salary and allowances of the Auditor General","s":"Salary and benefits of the Auditor General.","x":"1)      bo:"སྲིད་སྐྱོང་གི་འོས་མི་ནི་ལོ་ ༣༥ ལོན་པའི་བོད་ཀྱི་མི་མང་ཡིན་དགོས། བུ་ལོན་འཇལ་མ་ཐུབ་པ་དང་ཉེས་ཆད་ཕོག་མྱོང་བ། ལས་ཡུན་རིམ་པ་གཉིས་མུ་མཐུད་བཞེས་ཟིན་པ་བཅས་མིན་དགོས། སྲིད་སྐྱོང་ནི་འོས་འཕེན་པ་ཚང་མས་ཐད་ཀར་འདེམས་ཤིང་། ལས་ཡུན་ལོ་ལྔ་ཡིན། འོས་གྲངས་མཉམ་བྱུང་ན་བསྐྱར་དུ་འོས་བསྡུ་བྱེད།"}, r:["21","21A","24"], s:["charter","ec"]},
 {k:["parliament","mp","member of parliament","chitue","stand for parliament","25","candidate","སྤྱི་འཐུས"],
  q:{en:"Who can stand for Parliament?",bo:"སྤྱི་འཐུས་སུ་བྱེད་ཆོག"},
  a:{en:"A parliament candidate must be a Tibetan citizen aged at least 25. They must not be insolvent, convicted of a crime, or a CTA employee. They also must not hold a role under another country that could harm Tibetan interests. MPs serve a 5-year term.",
     bo:"སྤྱི་འཐུས་འོས་མི་ནི་ལོ་ ༢༥ ལོན་པའི་བོད་ཀྱི་མི་མང་ཡིན་དགོས། བུ་ལོན་འཇལ་མ་ཐུབ་པ་དང་། ཉེས་ཆད་ཕོག་མྱོང་བ། བོད་མིའི་སྒྲིག་འཛུགས་ཀྱི་ལས་བྱེད། བོད་མིའི་ཁེ་ཕན་ལ་གནོད་པའི་ཕྱི་རྒྱལ་གྱི་ལས་གནས་འཛིན་མཁན་བཅས་མིན་དགོས། ལས་ཡུན་ལོ་ལྔ་ཡིན།"}, r:["38","39"], s:["charter","parl"]},
 {k:["how many","seats","45","composition","province","u-tsang","dotoe","domey","religious","women","seat"],
  q:{en:"How is Parliament made up?",bo:"སྤྱི་འཐུས་ལྷན་ཚོགས་ཇི་ལྟར་གྲུབ།"},
  a:{en:"Parliament has 45 elected members: 10 from each of the three provinces (at least 2 women from each), 2 from each of the Nyingma, Kagyu, Sakya and Gelug schools and the Bon tradition, 2 from the Americas, 2 from Europe and Africa, and 1 from Asia and Australasia outside India, Nepal and Bhutan.",
     bo:"སྤྱི་འཐུས་ ༤༥ ཡོད། ཆོལ་ཁ་གསུམ་ནས་རེ་རེར་ ༡༠ (ཉུང་མཐར་བུད་མེད་ ༢)། རྙིང་མ། བཀའ་བརྒྱུད། ས་སྐྱ། དགེ་ལུགས། གཡུང་དྲུང་བོན་བཅས་ནས་རེ་རེར་ ༢། ཨ་མེ་རི་ཀ་ནས་ ༢། ཡོ་རོབ་དང་ཨ་ཧྥི་རི་ཀ་ནས་ ༢། རྒྱ་གར། བལ་ཡུལ། འབྲུག་ཡུལ་མ་གཏོགས་པའི་ཨེ་ཤ་ཡ་དང་ཨོ་སེ་ཡ་ནས་ ༡།"}, r:["37"], s:["charter","parl"]},
 {k:["kalon","kashag","cabinet","minister","བཀའ་བློན","བཀའ་ཤག"],
  q:{en:"How are Kalons chosen?",bo:"བཀའ་བློན་ཇི་ལྟར་འདེམས།"},
  a:{en:"After taking the oath, the Sikyong gives Parliament a list of up to 7 Kalon candidates. If Parliament doesn't approve them unanimously, MPs vote by secret ballot on each one, and a candidate needs at least 50% to be confirmed. Kalons need the same qualifications as the Sikyong, including being at least 35.",
     bo:"སྲིད་སྐྱོང་གིས་མནའ་སྐྱེལ་རྗེས་བཀའ་བློན་འོས་མི་ ༧ ལས་མི་བརྒལ་བའི་མིང་ཐོ་སྤྱི་འཐུས་ལྷན་ཚོགས་ལ་འབུལ། མོས་མཐུན་ཡོངས་རྫོགས་མ་བྱུང་ན་སྤྱི་འཐུས་ཀྱིས་གསང་བའི་འོས་ཤོག་འཕེན་ཞིང་། བརྒྱ་ཆ་ ༥༠ ཐོབ་དགོས། བཀའ་བློན་ལ་སྲིད་སྐྱོང་དང་འདྲ་བའི་ཆ་རྐྱེན་ཏེ་ལོ་ ༣༥ ལོན་དགོས།"}, r:["21","22"], s:["charter"]},
 {k:["rights","freedom","speech","religion","equal","equality","discrimination","lawyer","ཐོབ་ཐང"],
  q:{en:"What rights does the Charter give me?",bo:"བཅའ་ཁྲིམས་ཀྱིས་ཐོབ་ཐང་ཅི་སྤྲད་ཡོད།"},
  a:{en:"All Tibetans are equal before the law, whatever their sex, language, religion, wealth, birthplace or status. You have freedom of religion and the rights to life, liberty and property, free speech, movement, publishing and peaceful assembly. You can also get a free lawyer or interpreter in court if you need one. If your rights are violated, you can appeal to the Supreme Justice Commission.",
     bo:"བོད་མི་ཚང་མ་ཁྲིམས་ཀྱི་མདུན་དུ་འདྲ་མཉམ་ཡིན། ཆོས་དད་རང་དབང་དང་། སྲོག་དང་རང་དབང་། རྒྱུ་ནོར། སྐད་ཆ་བཤད་པ། འགྲོ་འོང་། དཔར་སྐྲུན། ཞི་བའི་འཚོགས་འདུ་བཅས་ཀྱི་ཐོབ་ཐང་ཡོད། ཁྲིམས་གཞིའི་སྐབས་དགོས་ན་ཁྲིམས་རྒྱབ་དང་ལོ་ཙཱ་བ་རིན་མེད་ཐོབ་ཐུབ། ཐོབ་ཐང་ལ་གནོད་འཚེ་བྱུང་ན་ཆོས་ཁྲིམས་ཞིབ་འཇུག་ཁང་ལ་ཞུ་གཏུག་བྱེད་ཆོག"}, r:["9","10","12","14"], s:["charter","sjc"]},
 {k:["duty","duties","chatrel","contribution","obligation","allegiance","ཆ་འཕྲལ","འགན་འཁུར"],
  q:{en:"What are my duties as a citizen?",bo:"མི་མང་གི་འགན་འཁུར་ཅི་ཡིན།"},
  a:{en:"The Charter asks every Tibetan citizen to be loyal to the CTA, respect the Charter and its laws, work towards resolving the Tibet issue, pay the voluntary contribution (chatrel) under the relevant laws, and help with tasks assigned under the law in emergencies.",
     bo:"བོད་མིའི་སྒྲིག་འཛུགས་ལ་བློ་གཏད་བརྟན་པོ་བྱེད་རྒྱུ། བཅའ་ཁྲིམས་དང་ཁྲིམས་ལུགས་བརྩི་སྲུང་བྱེད་རྒྱུ། བོད་དོན་ཐག་གཅོད་ཆེད་འབད་བརྩོན་བྱེད་རྒྱུ། ཁྲིམས་ལྟར་དྭངས་བླངས་ཆ་འཕྲལ་འབུལ་རྒྱུ། ཉེན་ཁའི་སྐབས་ཁྲིམས་ལྟར་ལས་འགན་འཁུར་རྒྱུ།"}, r:["13"], s:["charter","chatrel"]},
 {k:["election commission","who runs","cec","conduct election","referendum","independent","འོས་བསྡུ"],
  q:{en:"Who runs the elections?",bo:"འོས་བསྡུ་སུས་སྒྲིག"},
  a:{en:"An independent Central Election Commission runs the elections for MPs, the Speaker and Deputy Speaker, and the Sikyong. It also runs any referendum on a vital issue for Tibet. Its Chief Election Commissioner is chosen by a vote in Parliament from a list put forward by a nomination committee.",
     bo:"རང་བཙན་ཅན་གྱི་བོད་མིའི་འོས་བསྡུ་ལྷན་ཚོགས་ཀྱིས་སྤྱི་འཐུས་དང་། ཚོགས་གཙོ་དང་ཚོགས་གཙོ་གཞོན་པ། སྲིད་སྐྱོང་བཅས་ཀྱི་འོས་བསྡུ་སྒྲིག བོད་དོན་གལ་ཆེན་ཐོག་མི་མང་གི་འདོད་བློ་ལེན་པ་ཡང་སྒྲིག འོས་བསྡུའི་འགོ་ཁྲིད་ནི་འོས་གཞིའི་ཚོགས་ཆུང་གི་མིང་ཐོ་ནས་སྤྱི་འཐུས་ལྷན་ཚོགས་ཀྱིས་འདེམས།"}, r:["96","97"], s:["ec","charter"]},
 {k:["justice","court","supreme justice","judiciary","complaint","appeal","dispute","ཁྲིམས"],
  q:{en:"What does the Supreme Justice Commission do?",bo:"ཆོས་ཁྲིམས་ཞིབ་འཇུག་ཁང་གི་ལས་འགན།"},
  a:{en:"It is the CTA's highest judicial body, with a Chief Justice Commissioner and two Justice Commissioners. Parliament elects them from a list drawn up by a nomination committee. You can go to it, or to a local justice commission, if your fundamental rights under the Charter are violated.",
     bo:"བོད་མིའི་སྒྲིག་འཛུགས་ཀྱི་ཁྲིམས་ཁང་མཐོ་ཤོས་ཡིན། ཆོས་ཁྲིམས་ཞིབ་འཇུག་པ་གཙོ་བོ་ ༡ དང་ཞིབ་འཇུག་པ་ ༢ ཡོད། འོས་གཞིའི་ཚོགས་ཆུང་གི་མིང་ཐོ་ནས་སྤྱི་འཐུས་ལྷན་ཚོགས་ཀྱིས་འདེམས། བཅའ་ཁྲིམས་ཀྱི་ཐོབ་ཐང་ལ་གནོད་འཚེ་བྱུང་ན་འདིར་རམ་ས་གནས་ཆོས་ཁྲིམས་ཞིབ་འཇུག་ཁང་དུ་ཞུ་གཏུག་བྱེད་ཆོག"}, r:["14","62","63"], s:["sjc","charter"]},
 {k:["amend","change the charter","amendment","two-thirds","བཟོ་བཅོས"],
  q:{en:"How can the Charter be changed?",bo:"བཅའ་ཁྲིམས་བཟོ་བཅོས་ཇི་ལྟར་བྱེད།"},
  a:{en:"Most articles can be changed by an Act of Parliament backed by at least two-thirds of all MPs and signed by the Sikyong. The Preamble, the core principles (Articles 1, 3 and 4) and the chapters on rights and directive principles need at least three-quarters of all MPs instead.",
     bo:"དོན་ཚན་མང་ཆེ་བ་སྤྱི་འཐུས་ཡོངས་ཀྱི་ཆ་གསུམ་ཆ་གཉིས་ཀྱི་རྒྱབ་སྐྱོར་དང་སྲིད་སྐྱོང་གི་མིང་རྟགས་ཀྱིས་བཟོ་བཅོས་བྱེད་ཐུབ། སྔོན་གླེང་དང་དོན་ཚན་ ༡། ༣། ༤། ཐོབ་ཐང་དང་ལམ་སྟོན་གཞི་རྩའི་ལེའུ་རྣམས་ལ་ཆ་བཞི་ཆ་གསུམ་དགོས།"}, r:["111"], s:["charter","parl"]},
 {k:["dalai lama","his holiness","protector","symbol","གོང་ས"],
  q:{en:"What role does His Holiness have in the Charter?",bo:"བཅའ་ཁྲིམས་ནང་གོང་ས་མཆོག་གི་གོ་གནས།"},
  a:{en:"Article 1 recognises His Holiness the Dalai Lama as the protector and symbol of Tibet and the Tibetan people. Since 2011, political leadership has been held by the elected leaders, mainly the Sikyong and the Kashag.",
     bo:"དོན་ཚན་ ༡ ནང་གོང་ས་ཏཱ་ལའི་བླ་མ་མཆོག་བོད་དང་བོད་མིའི་མགོན་སྐྱབས་དང་མཚོན་རྟགས་སུ་ངོས་འཛིན་ཡོད། ༢༠༡༡ ལོ་ནས་བཟུང་སྲིད་དོན་འགོ་ཁྲིད་ནི་མི་མང་གིས་བདམས་པའི་སྲིད་སྐྱོང་དང་བཀའ་ཤག་གིས་གནང་བཞིན་ཡོད།"}, r:["1"], s:["charterPage","charter"]},
 {k:["principle","non-violence","democracy","polity","peace","nature","དམངས་གཙོ"],

  a:{en:"The Charter says Tibetan governance rests on peace and non-violence. On that basis it is built on freedom, social welfare, the coexistence of religion and politics, democracy and self-government. The CTA also commits to the UN Universal Declaration of Human Rights.",

  </details>`;

const ART_NOTES = CHARTER.articles.filter(a=>!a.rep).map(a=>`Art ${a.n} (${a.t}): ${a.s}`).join("\n");
function systemPrompt(){
  return `You are the "Ask AI" helper in CTA Hub, an independent guide for everyday Tibetans about the Central Tibetan Administration (CTA) and the Charter of Tibetans-in-Exile.
Rules: Answer in plain, friendly ${LANG==="bo"?"Tibetan (Unicode Tibetan script, simple everyday words)":"English (short sentences, no legal jargon)"}, 40-130 words. Base the answer ONLY on the Charter notes below. Mention the article numbers you used inline, e.g. "(Article 11)". For current office-holders and 2026 results, use only the "Current leaders" notes (from tibet.net, November 2026). If the notes don't cover the question (for example dates of the next election, polling places, registration deadlines, or anyone not listed), say so plainly and suggest checking the Central Election Commission (tibetanelection.net) or tibet.net. Do not give opinions on candidates or parties. Never invent article numbers. No markdown; plain paragraphs only.

Detailed notes:
${KB.map(e=>`- ${e.q.en} ${e.a.en} [Articles ${e.r.join(", ")}]`).join("\n")}

Current leaders (tibet.net, November 2026):
Sikyong: ${LEADERS.sikyong.n}. Kalons: ${LEADERS.kalons.map(k=>k.n+" ("+k.d.en+")").join("; ")}. Speaker: ${LEADERS.speaker}; Deputy Speaker: ${LEADERS.deputy}.
MPs by constituency: ${LEADERS.parl.map(g=>g.c.en+": "+g.m.join(", ")).join(" | ")}.
Justice: ${LEADERS.justice.map(p=>p.n+" ("+p.r.en+")").join("; ")}. ${LEADERS.bodies.map(p=>p.n+" ("+p.r.en+")").join("; ")}.
2026 Sikyong preliminary: ${LEADERS.sikyongResult.rows.map(r=>r.n+" "+r.v).join(", ")} of 51,140 votes. ${LEADERS.sikyongResult.note.en} ${LEADERS.parlResult.en}
Be neutral: state facts only, no opinions on any person.

One-line summary of every article:
${ART_NOTES}`;
}
function match(q){
  const t = q.toLowerCase(); let best=null, score=0;
  for (const e of KB){
    let s = (e.q.en.toLowerCase()===t || e.q.bo===q) ? 100 : 0;
    for (const k of e.k) if (t.includes(k)) s += k.length;
    if (s>score){score=s;best=e;}
  }
  return score>0 ? best : null;
}
function sourcesHTML(keys){
  const ks = [...new Set([...(keys||[]),"charter"])];
  return `<div class="srcs"><p class="label" style="margin:0 0 2px">${T("srcH")}</p>` +
    ks.map(k=>SRC[k]).map(s=>`<a href="${s.u}" target="_blank" rel="noopener"><span>${esc(L(s.t))}</span><span>${esc(s.d)} ›</span></a>`).join("") + '</div>';
}
const artLabel = n => (LANG==="bo" ? "དོན་ཚན་ " : "Article ") + num(n);
async function ask(q){
  q = q.trim(); if(!q) return;
  const hit = match(q);
  const card = document.createElement("article");
  card.className = "card answer";
  card.innerHTML = `<div class="qrow"><p class="q">${esc(q)}</p></div><div class="body typing">${T("thinking")}</div>`;
  $("#answers").prepend(card);
  const body = card.querySelector(".body");
  const finish = (text, refs, srcKeys, mode) => {
    body.classList.remove("typing"); body.textContent = text;
    card.querySelector(".qrow").insertAdjacentHTML("beforeend", spkBtn(text));
    card.insertAdjacentHTML("beforeend",
      (refs&&refs.length ? `<div class="refs">${refs.map(r=>`<button type="button" class="ref" data-art="${esc(r)}">${esc(artLabel(r))}</button>`).join("")}</div>` : "") +
      sourcesHTML(srcKeys) + `<p class="mode">${mode}</p>` + waBtn("❓ " + q + "\n\n" + text.slice(0,600)));
  };
  if (sample){
    try{
      const res = await sample([{role:"user",content:systemPrompt()+"\n\nQuestion: "+q}], {
        modelTier:"quick", onText:({text})=>{ body.classList.remove("typing"); body.textContent = text; } });
      const ids = new Set(CHARTER.articles.map(a=>a.n));
      const refs = [...new Set([...res.text.matchAll(/Article\s+(\d+[A-Z]?)/g)].map(m=>m[1]).filter(n=>ids.has(n)))];
      finish(res.text, refs.length?refs:(hit?hit.r:[]), hit?hit.s:["ec","cta"], T("modeAI"));
      return;
    }catch(e){ if (e && e.code==="not_granted") sample=null; }
  }
  if (hit) finish(L(hit.a), hit.r, hit.s, T("modeKB"));
  else finish(T("noMatch"), [], ["ec","cta"], T("modeNone"));
}

function hl(s,q){ if(!q) return esc(s); const i=s.toLowerCase().indexOf(q.toLowerCase()); if(i<0) return esc(s); return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length)); }
function renderCharter(){
  const q = chQuery.trim().toLowerCase();
  const hit = a => !q || a.n.toLowerCase()===q || a.t.toLowerCase().includes(q) || a.s.toLowerCase().includes(q) || a.x.toLowerCase().includes(q);
  const list = CHARTER.articles.filter(hit);
  $("#chCount").textContent = (LANG==="en"&&list.length===1 ? "1 article" : T("chCount").replace("{n}", num(list.length))) + (LANG==="bo"?" · "+T("chBoNote"):"");
  let html = "";
  for (const ch of CHARTER.chapters){
    const arts = list.filter(a=>a.c===ch.id); if(!arts.length) continue;
    html += `<p class="chap">${LANG==="bo"?"ལེའུ་":"Chapter "}${ch.id} · ${esc(ch.name)}</p>`;
    html += arts.map(a=>{
      let snippet = "";
      if (q && !a.t.toLowerCase().includes(q) && !a.s.toLowerCase().includes(q) && a.x.toLowerCase().includes(q)){
        const i=a.x.toLowerCase().indexOf(q); snippet = `<div class="ss">…${hl(a.x.slice(Math.max(0,i-50), i+q.length+60).replace(/\n/g," "), q)}…</div>`;
      }
      return `<details class="art${a.rep?" rep":""}" id="art-${a.n}"><summary><span class="num">${num(a.n)}</span><span><div class="tt">${hl(a.t,q)}</div><div class="ss">${hl(a.s,q)}</div>${snippet}</span></summary>
        <div class="full"><span class="lbl">${T("chFull")}</span>${a.rep?esc(T("chRep")):hl(a.x,q)}${a.rep?"":`<div style="white-space:normal">${waBtn("📜 Charter, Article "+a.n+": "+a.t+"\n"+a.s)}</div>`}</div></details>`;
    }).join("");
  }
  $("#chList").innerHTML = html || `<p class="lede">${LANG==="bo"?"མཐུན་པ་མ་རྙེད།":"No articles match."}</p>`;
}

let speakingBtn = null;
function setSpeaking(btn){ $$(".speak[data-on='1']").forEach(b=>b.dataset.on="0"); $("#readPage").setAttribute("aria-pressed","false"); $("#readPage span").textContent=T("readAloud");
  speakingBtn = btn; if (btn){ if (btn.id==="readPage"){ btn.setAttribute("aria-pressed","true"); btn.querySelector("span").textContent=T("stop"); } else btn.dataset.on="1"; } }
async function say(text, btn){
  if (!tts) return;
  if (speakingBtn===btn){ try{ tts.stop(); }catch(e){} setSpeaking(null); return; }
  setSpeaking(btn);
  try{ await tts.speak(text.slice(0,2000), tts.fallback?undefined:(LANG==="en"?{language:"en"}:{})); }
  catch(e){ if (e && e.code==="not_granted"){ tts=null; document.body.classList.remove("tts-ok"); } }
  if (speakingBtn===btn) setSpeaking(null);
}

  say(text, $("#readPage"));
});

/* ---------- shared store ---------- */
let DB = null, USR = null, ME = null, CANWRITE = null, IS_OWNER = false;
let boardDocs = [], votesDocs = [], boardState = "loading", votesState = "loading", boardTopic = "all", openReplies = new Set(), names = {};
async function initShared(){
  try{ if (window.claude && claude.use){ DB = await claude.use("db"); USR = await claude.use("user"); } }catch(e){}
  if (USR){ try{ ME = await USR.id(); IS_OWNER = USR.isOwner(); CANWRITE = await USR.can("data.write"); }catch(e){} }
  if (!DB){ boardState = votesState = "off"; renderBoard(); renderPolls(); return; }
  const t1 = setTimeout(()=>{ if(boardState==="loading"){ boardState="slow"; renderBoard(); } }, 10000);
  DB.collection("board").onSnapshot(snap=>{ boardDocs = snap.docs.filter(d=>d.exists).map(d=>({uid:d.id, ...d.data()})); if(!snap.metadata.fromCache){ clearTimeout(t1); } boardState="ok"; loadNames(); renderBoard(); },
    e=>{ clearTimeout(t1); boardState="err"; renderBoard(); });
  const t2 = setTimeout(()=>{ if(votesState==="loading"){ votesState="slow"; renderPolls(); } }, 10000);
  DB.collection("votes").onSnapshot(snap=>{ votesDocs = snap.docs.filter(d=>d.exists).map(d=>({uid:d.id, ...d.data()})); if(!snap.metadata.fromCache) clearTimeout(t2); votesState="ok"; renderPolls(); },
    e=>{ clearTimeout(t2); votesState="err"; renderPolls(); });
}
async function loadNames(){
  if (!USR || !USR.profiles) return;
  const ids = [...new Set(boardDocs.map(d=>d.uid))].filter(id=>!(id in names));
  if (!ids.length) return;
  try{ const ps = await USR.profiles(ids); ids.forEach(id=>{ names[id] = (ps[id] && ps[id].name) || ""; }); renderBoard(); }catch(e){}
}
const who = uid => uid===ME ? (LANG==="bo"?"ང་།":"You") : (names[uid] || (LANG==="bo"?"མི་ཞིག":"Someone"));
const myBoardRef = () => DB.collection("board").doc(ME);
function myBoard(){ const d = boardDocs.find(x=>x.uid===ME); return {posts:(d&&d.posts)||[], replies:(d&&d.replies)||[]}; }
let writing = false;
async function writeMine(mut){
  if (writing) return false; writing = true;
  try{ const cur = myBoard(); const next = mut({posts:cur.posts.map(p=>({...p})), replies:cur.replies.map(r=>({...r}))}); await myBoardRef().set(next); return true; }
  catch(e){ if (e && e.code==="invalid_argument") CANWRITE = false; alertBox(e && e.code==="quota_exceeded" ? (LANG==="bo"?"གསོག་ས་ཁེངས་ཟིན།":"The board is full. Ask the owner to tidy old posts.") : (LANG==="bo"?"འགོད་མ་ཐུབ།":"Couldn't post. You may only have view access.")); renderBoard(); return false; }
  finally{ writing = false; }
}
async function modRemove(uid, kind, id){
  const d = boardDocs.find(x=>x.uid===uid); if(!d) return;
  const body = {posts:(d.posts||[]).filter(p=>!(kind==="post"&&p.id===id)), replies:(d.replies||[]).filter(r=>!(kind==="reply"&&r.id===id))};
  try{ await DB.collection("board").doc(uid).set(body); }catch(e){ alertBox(LANG==="bo"?"སུབ་མ་ཐུབ།":"Couldn't remove it."); }
}
let alertT; function alertBox(msg){ const el=$("#boardAlert"); if(!el) return; el.textContent=msg; el.hidden=false; clearTimeout(alertT); alertT=setTimeout(()=>{el.hidden=true;},5000); }
const ago = ts => { const s=(Date.now()-ts)/1000; const bo=LANG==="bo";
  if (s<60) return bo?"ད་ལྟ།":"just now"; if (s<3600) return bo?`སྐར་མ་ ${num(Math.floor(s/60))} སྔོན།`:`${Math.floor(s/60)} min ago`;
  if (s<86400) return bo?`ཆུ་ཚོད་ ${num(Math.floor(s/3600))} སྔོན།`:`${Math.floor(s/3600)} h ago`; return new Date(ts).toLocaleDateString(bo?"en-IN":"en-GB",{day:"numeric",month:"short"}); };

function renderBoard(){
  const w = $("#boardWrap"); if(!w) return; const bo = LANG==="bo";
  if (boardState==="hidden"){ w.innerHTML=""; return; }
  if (boardState==="off" && FIREBASE_CONFIG){ w.innerHTML=""; return; }
  if (boardState==="off"){ w.innerHTML = `<div class="card status">${bo?"གྲོས་བསྡུར་ས་འདི་ CTA Hub ཡི་དྲ་ཚིགས་ཐོག་ནང་བསྡད་དེ་ཞུགས་དགོས། (ནང་འཛུལ་བྱས་ཏེ།)":"The discussion board works when CTA Hub is opened from its claude.ai link while signed in."}</div>`; return; }
  if (boardState==="loading"){ w.innerHTML = `<div class="status">${bo?"ཕབ་ལེན་བྱེད་བཞིན་པ།…":"Loading posts…"}</div>`; return; }
  if (boardState==="err"){ w.innerHTML = `<div class="card status">${bo?"ད་ལྟ་གྲོས་བསྡུར་ས་འབྲེལ་མ་ཐུབ།":"The board can't be reached right now."}</div>`; return; }
  const all = boardDocs.flatMap(d=>(d.posts||[]).map(p=>({...p, uid:d.uid})));
  const reps = boardDocs.flatMap(d=>(d.replies||[]).map(r=>({...r, uid:d.uid})));
  const list = all.filter(p=>boardTopic==="all"||p.topic===boardTopic).sort((a,b)=>b.ts-a.ts);
  const canPost = ME && CANWRITE!==false;
  const tName = id => L((TOPICS.find(t=>t.id===id)||TOPICS[4]).t);
  w.innerHTML = `
   ${boardState==="slow"?`<p class="status">${bo?"ཆ་འཕྲིན་གསར་ཤོས་མིན་སྲིད།":"Posts may be out of date."}</p>`:""}
   <p class="note" id="boardAlert" hidden role="status"></p>
   ${canPost ? `<details class="card" id="newPost"><summary>✏️ ${bo?"དྲི་བ་གསར་པ་འགོད།":"Start a new discussion"}</summary>
     <form id="postForm"><label class="flabel" for="pTopic">${bo?"བརྗོད་གཞི།":"Topic"}</label>
     <select id="pTopic" class="field">${TOPICS.map(t=>`<option value="${t.id}">${esc(L(t.t))}</option>`).join("")}</select>
     <label class="flabel" for="pTitle">${bo?"ཁ་བྱང་།":"Title"}</label><input id="pTitle" class="field" maxlength="120" required>
     <label class="flabel" for="pBody">${bo?"ནང་དོན།":"Your message"}</label><textarea id="pBody" class="field" maxlength="2000" required></textarea>
     <p class="mode">${bo?"འགོད་པའི་སྔོན་ལ་སྒྲིག་གཞི་ཀློག་རོགས།":"By posting you agree to the community rules."}</p>
     <button class="btn" type="submit" style="margin-top:6px">${bo?"འགོད།":"Post"}</button></form></details>`
   : `<p class="note">${bo?"ཀློག་ཆོག་ཀྱང་འགོད་པར་ཆོག་མཆན་དགོས། CTA Hub བདག་པོར་ཞུ།":"You can read the discussion. To post, ask the owner of CTA Hub to give you edit access."}</p>`}
   <div class="topics" role="group" aria-label="Filter by topic" style="margin-top:12px">
     <button type="button" data-topic="all" aria-pressed="${boardTopic==="all"}">${bo?"ཚང་མ།":"All"}</button>
     ${TOPICS.map(t=>`<button type="button" data-topic="${t.id}" aria-pressed="${boardTopic===t.id}">${esc(L(t.t))}</button>`).join("")}</div>
   <div class="stack">${list.length ? list.map(p=>{
     const rs = reps.filter(r=>r.post===p.uid+":"+p.id).sort((a,b)=>a.ts-b.ts); const open = openReplies.has(p.uid+":"+p.id);
     return `<article class="card post"><div class="ph2"><h3></h3><span class="tg">${esc(tName(p.topic))}</span></div>
      <div class="by">${esc(who(p.uid))} · ${ago(p.ts)}</div><p class="tx"></p>
      <div class="acts"><button type="button" class="lnk" data-toggle="${p.uid}:${p.id}">💬 ${num(rs.length)} ${bo?"ལན།":(rs.length===1?"reply":"replies")}</button>
      ${(p.uid===ME||IS_OWNER)?`<button type="button" class="lnk del" data-del="post" data-uid="${p.uid}" data-id="${p.id}">${bo?"སུབ།":"Delete"}</button>`:""}</div>
      ${open?`<div class="replies">${rs.map(r=>`<div class="reply"><div class="by">${esc(who(r.uid))} · ${ago(r.ts)} ${(r.uid===ME||IS_OWNER)?`<button type="button" class="lnk del" data-del="reply" data-uid="${r.uid}" data-id="${r.id}">${bo?"སུབ།":"Delete"}</button>`:""}</div><p class="tx" data-rtext="${r.uid}:${r.id}"></p></div>`).join("")}
        ${canPost?`<form class="rform" data-reply="${p.uid}:${p.id}"><label class="sr" for="r-${p.id}">${bo?"ལན།":"Reply"}</label><input id="r-${p.id}" class="field" maxlength="1000" placeholder="${bo?"ལན་འདེབས།…":"Write a reply…"}" required><button class="btn" type="submit">${bo?"གཏོང་།":"Send"}</button></form>`:""}</div>`:""}
     </article>`; }).join("") : `<div class="card status">${bo?"ད་དུང་གྲོས་བསྡུར་མེད། དང་པོ་ཁྱེད་ཀྱིས་འགོ་འཛུགས།":"No discussions yet. Be the first to start one!"}</div>`}</div>`;
  // fill untrusted text safely
  const posts = w.querySelectorAll("article.post"); list.forEach((p,i)=>{ const el=posts[i]; if(!el) return; el.querySelector("h3").textContent=p.title||""; el.querySelector(".tx").textContent=p.body||""; });
  w.querySelectorAll("[data-rtext]").forEach(el=>{ const [uid,id]=el.dataset.rtext.split(":"); const r=reps.find(x=>x.uid===uid&&x.id===id); el.textContent = r?r.body:""; });
}
document.addEventListener("submit", async e=>{
  if (e.target.id==="postForm"){ e.preventDefault();
    const title=$("#pTitle").value.trim(), body=$("#pBody").value.trim(), topic=$("#pTopic").value; if(!title||!body) return;
    const ok = await writeMine(b=>{ b.posts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), topic, title, body, ts:Date.now()}); b.posts=b.posts.slice(-50); return b; });
    if (ok){ boardTopic="all"; }
  } else if (e.target.matches(".rform")){ e.preventDefault();
    const key=e.target.dataset.reply, inp=e.target.querySelector("input"), body=inp.value.trim(); if(!body) return;
    await writeMine(b=>{ b.replies.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), post:key, body, ts:Date.now()}); b.replies=b.replies.slice(-200); return b; });
  }
});
document.addEventListener("click", e=>{
  const tp = e.target.closest("[data-topic]"); if (tp){ boardTopic=tp.dataset.topic; renderBoard(); return; }
  const tg = e.target.closest("[data-toggle]"); if (tg){ const k=tg.dataset.toggle; openReplies.has(k)?openReplies.delete(k):openReplies.add(k); renderBoard(); return; }
  const dl = e.target.closest("[data-del]"); if (dl){
    if (!dl.dataset.confirm){ dl.dataset.confirm="1"; dl.textContent = LANG==="bo"?"གཏན་འཁེལ།":"Tap again to delete"; setTimeout(()=>{ if(dl.isConnected){ delete dl.dataset.confirm; dl.textContent = LANG==="bo"?"སུབ།":"Delete"; } },3000); return; }
    const {del:kind, uid, id} = dl.dataset;
    if (uid===ME) writeMine(b=>({posts:b.posts.filter(p=>!(kind==="post"&&p.id===id)), replies:b.replies.filter(r=>!(kind==="reply"&&r.id===id))}));
    else if (IS_OWNER) modRemove(uid, kind, id);
    return; }
  const pv = e.target.closest("[data-poll]"); if (pv){ castVote(pv.dataset.poll, pv.dataset.opt); return; }
});

/* polls */
let voting = false;
async function castVote(pid, oid){
  if (window.fbVote) return window.fbVote(pid, oid);
  if (!DB || !ME || voting) return; voting = true;
  const mine = (votesDocs.find(v=>v.uid===ME)||{}); const next = {...mine}; delete next.uid;
  if (next[pid]===oid) { voting=false; return; }
  next[pid] = oid;
  try{ await DB.collection("votes").doc(ME).set(next); }catch(e){ const el=$("#pollAlert"); if(el){ el.hidden=false; el.textContent = LANG==="bo"?"འོས་འཕེན་མ་ཐུབ།":"Couldn't save your vote. You may only have view access."; } }
  voting = false;
}
function renderPolls(){
  const w = $("#pollList"); if(!w) return; const bo = LANG==="bo";
  const live = votesState==="ok"||votesState==="slow";
  const mine = (votesDocs.find(v=>v.uid===ME)||{});
  w.innerHTML = (votesState==="off" && !FIREBASE_CONFIG ? `<p class="note">${bo?"འོས་འཕེན་པར་ CTA Hub ཡི་ claude.ai འབྲེལ་མཐུད་ནས་ནང་འཛུལ་བྱེད་དགོས།":"Voting works when CTA Hub is opened from its claude.ai link while signed in."}</p>` : "") +
   (votesState==="slow" ? `<p class="status">${bo?"མཇུག་འབྲས་གསར་ཤོས་མིན་སྲིད།":"Results may be out of date."}</p>` : "") +
   `<p class="note" id="pollAlert" hidden role="status"></p>` +
   POLLS.map(p=>{
     const counts = {}; p.o.forEach(o=>counts[o.id]=0); votesDocs.forEach(v=>{ if (v[p.id] in counts) counts[v[p.id]]++; });
     const tot = Object.values(counts).reduce((a,b)=>a+b,0); const voted = !!mine[p.id];
     return `<div class="card poll"><h3>${esc(L(p.q))}</h3>${p.o.map(o=>{ const pc = tot? Math.round(counts[o.id]/tot*100):0; const show = voted || !live;
       return `<button type="button" class="popt ${mine[p.id]===o.id?"mine":""}" data-poll="${p.id}" data-opt="${o.id}" ${(!(DB&&ME)&&!window.fbVote)?"disabled":""} aria-pressed="${mine[p.id]===o.id}">
